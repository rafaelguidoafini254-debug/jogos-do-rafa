<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c100f">
<title>Cronômetro Impostor</title>
<meta name="description" content="Acerte o tempo no cronômetro escondido e descubra quem é o impostor. Jogue online com salas abertas ou privadas, no mesmo celular ou treinando sozinho.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Chivo+Mono:wght@400;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='38' fill='%23050706' stroke='%233dff74' stroke-width='8'/%3E%3Crect x='42' y='4' width='16' height='12' rx='3' fill='%233dff74'/%3E%3Cpath d='M50 55 L50 30' stroke='%233dff74' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Layout: one centered column, one screen at a time — a black LED timer panel and a big arcade push button */
:root{
  --bg:#0c100f; --panel:#151b19; --line:#26302c; --fg:#e9f2ec; --muted:#8ea197;
  --led:#3dff74; --led-off:rgba(61,255,116,.07); --ink:#04140a;
  --crew:#3dff74; --imp:#ff4d5e; --warn:#ffc53d;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --mono:"Chivo Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);font-size:16px;padding-inline:16px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background-image:radial-gradient(circle at 50% -10%,#14261c 0,transparent 55%);background-attachment:fixed}
.app{max-width:460px;margin:0 auto;padding-block:16px 32px;min-height:100%;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hleft{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-weight:800;font-size:1.1rem;background:none;color:var(--fg);padding:0;white-space:nowrap}
.brand span{color:var(--led)}
.back{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:8px 12px;font-weight:800;font-size:.95rem;white-space:nowrap}
.app:has(#backBtn:not([hidden])) .brand{display:none}
.hright{display:flex;align-items:center;gap:10px}
.tag{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;white-space:nowrap}
.snd{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:6px 10px;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em}
section{display:flex;flex-direction:column;gap:16px}
h1{font-size:2rem;line-height:1.05;margin:0;text-wrap:balance;font-weight:800}
h2{font-size:.78rem;margin:0;font-family:var(--mono);font-weight:400;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
p{margin:0;color:var(--muted);line-height:1.5}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--led);outline-offset:3px}
.btn{background:var(--led);color:var(--ink);font-weight:800;font-size:1.1rem;padding:16px;width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.red{background:var(--imp);color:#1a0306}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);padding:12px 14px;font-weight:500}
.ghost:disabled{opacity:.4}
.players{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.players li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:10px;border:1px solid var(--line);min-height:46px}
.players li.off{opacity:.45}
.players li .n{font-family:var(--mono);color:var(--muted);font-size:.8rem;width:1.6em}
.players li .name{flex:1;min-width:0;overflow-wrap:anywhere}
.players li .badge{font-family:var(--mono);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.players li .badge.ok{color:var(--led)}
.x{background:transparent;color:var(--muted);font-size:1.3rem;line-height:1;padding:2px 8px}
.add,.inline{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px}
input.code{font-family:var(--mono);text-transform:uppercase;letter-spacing:.3em;font-size:1.2rem;text-align:center}
label.lbl{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;background:var(--bg);color:var(--fg);border:1px solid var(--line);font-size:1.2rem}
.step button:disabled{opacity:.3}
.step output{font-family:var(--mono);font-weight:700;min-width:4.4em;text-align:center;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{background:transparent;color:var(--muted);padding:10px;font-weight:800}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.hint{font-size:.85rem}
.err{color:var(--imp);font-size:.9rem}
.err:empty{display:none}
.center{text-align:center}

/* LED panel */
.panel{background:#050706;border-radius:12px;padding:18px 16px 12px;border:1px solid #1d2622;
  box-shadow:inset 0 0 0 4px #0f1412, 0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;gap:8px}
.led{display:flex;align-items:flex-end;justify-content:center;gap:2%;width:100%;max-width:340px}
.led svg{height:auto;display:block}
.led .dg{width:21%}
.led .dt{width:5%}
.led .on{fill:var(--led);filter:drop-shadow(0 0 4px var(--led))}
.led .off{fill:var(--led-off)}
.led.red .on{fill:var(--imp);filter:drop-shadow(0 0 4px var(--imp))}
.led.blink .on{animation:blink 1s steps(2,start) infinite}
.led.code .dg{width:23%}
@keyframes blink{to{opacity:.25}}
.plabel{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:center}
.bigcode{font-family:var(--mono);font-weight:700;font-size:3rem;letter-spacing:.25em;color:var(--led);text-shadow:0 0 12px rgba(61,255,116,.5);padding-left:.25em}

/* arcade push button */
.pushwrap{display:grid;place-items:center;padding-block:8px}
.push{width:min(58vw,220px);aspect-ratio:1;border-radius:50%;position:relative;color:var(--ink);font-weight:800;font-size:1.3rem;letter-spacing:.06em;
  background:#111;padding:14px;box-shadow:0 8px 0 #000, 0 14px 30px rgba(0,0,0,.6);touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.push span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 40% 30%,#c9ffd9 0,var(--led) 35%,#13a845 100%);
  box-shadow:0 0 30px rgba(61,255,116,.45), inset 0 -8px 16px rgba(0,0,0,.25);transition:transform .06s}
.push.on span{background:radial-gradient(circle at 40% 30%,#ffd0d5 0,var(--imp) 35%,#a8152a 100%);box-shadow:0 0 34px rgba(255,77,94,.5), inset 0 -8px 16px rgba(0,0,0,.25);color:#1a0306}
.push:active span,.push.pressed span{transform:translateY(4px) scale(.97)}
.push:disabled{cursor:default;opacity:.6}
.keyhint{font-size:.8rem;text-align:center}
@media (prefers-reduced-motion:reduce){.led.blink .on{animation:none}.push span{transition:none}}

.role{font-size:2.2rem;font-weight:800;text-align:center;line-height:1}
.role.imp{color:var(--imp)}
.who{font-size:2.6rem;font-weight:800;color:var(--led);text-align:center;overflow-wrap:anywhere}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,7em) 1fr auto;align-items:center;gap:10px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:14px;background:var(--bg);border-radius:7px;position:relative;border:1px solid var(--line)}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--muted)}
.bar.imp .fill{background:var(--imp)}
.bar.crew .fill{background:var(--crew)}
.bar .t{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.9rem}
.target{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg)}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vote button{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:14px 10px;overflow-wrap:anywhere}
.vote button[aria-pressed=true]{border-color:var(--imp);background:var(--imp);color:#1a0306;font-weight:800}
.vote button:disabled:not([aria-pressed=true]){opacity:.45}
.vote .skip{grid-column:1/-1;background:transparent;color:var(--muted)}
.score{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.score li{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.verdict{font-size:1.8rem;font-weight:800;text-align:center;text-wrap:balance}
.rules{font-size:.9rem}
.rules ol{margin:0;padding-left:1.2em;color:var(--muted);line-height:1.55;display:flex;flex-direction:column;gap:4px}
.modes{display:flex;flex-direction:column;gap:12px}
.mode{background:var(--panel);border:1px solid var(--line);color:var(--fg);text-align:left;padding:20px;display:flex;flex-direction:column;gap:6px}
.mode:hover{border-color:var(--led)}
.mode .mt{font-size:1.5rem;font-weight:800}
.mode .md{color:var(--muted);line-height:1.45}
.mode.online .mt{color:var(--warn)} .mode.imp .mt{color:var(--imp)} .mode.solo .mt{color:var(--led)}
.grade{font-size:2rem;font-weight:800;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 4px}
.stats b{display:block;font-family:var(--mono);font-size:1.2rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.75rem;color:var(--muted)}
.roomlist{display:flex;flex-direction:column;gap:8px}
.roomitem{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--fg);text-align:left;width:100%}
.roomitem .rn{flex:1;min-width:0;font-weight:800;overflow-wrap:anywhere}
.roomitem .rs{font-family:var(--mono);font-size:.75rem;color:var(--muted);white-space:nowrap}
.roomitem .go{color:var(--led);font-weight:800;white-space:nowrap}
.roomitem:disabled{opacity:.5}
.empty{color:var(--muted);text-align:center;padding:12px;font-size:.9rem}
.pill{display:inline-block;font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.pub{color:var(--warn);border-color:rgba(255,197,61,.4)}
.pill.priv{color:var(--led);border-color:rgba(61,255,116,.35)}
.cd{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--warn)}
.conn{font-family:var(--mono);font-size:.75rem;color:var(--warn);text-align:center}
/* chat */
.mode.word .mt{color:#7cc4ff}
.mode.pen .mt{color:var(--warn)}
.mode.guess .mt{color:#c79bff}
.clues{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none;counter-reset:c}
.clues li{display:flex;gap:12px;align-items:baseline;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;line-height:1.35}
.clues li .cn{font-family:var(--mono);color:#c79bff;font-weight:700;min-width:1.4em}
.clues li.new{border-color:#c79bff}
.pts{font-family:var(--mono);color:var(--warn);text-align:center}
.name-in{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pens{display:flex;flex-direction:column;gap:12px}
.penrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px}
.penrow .pn{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.penrow .pg{font-family:var(--mono);font-weight:700;font-size:1.6rem;color:var(--warn);font-variant-numeric:tabular-nums}
.balls{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ball{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:800}
.ball.g{background:var(--led);border-color:var(--led);color:var(--ink)}
.ball.m{background:transparent;border-color:var(--imp);color:var(--imp)}
.ball.now{border-color:var(--warn);box-shadow:0 0 0 3px rgba(255,197,61,.25)}
.goal{font-size:3rem;font-weight:800;text-align:center;color:var(--led);letter-spacing:.04em;line-height:1}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duel div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;min-width:0}
.duel div.win{border-color:var(--led);box-shadow:inset 0 0 0 1px var(--led)}
.duel b{display:block;overflow-wrap:anywhere}
.duel .t{display:block;font-family:var(--mono);font-size:1.3rem;font-variant-numeric:tabular-nums}
.duel small{display:block;color:var(--muted);font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);color:var(--muted);border:1px solid var(--line);padding:8px 12px;border-radius:99px;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--led);color:var(--ink);border-color:var(--led);font-weight:800}
.secret{font-size:2.6rem;font-weight:800;text-align:center;color:var(--led);overflow-wrap:anywhere;line-height:1.05;text-shadow:0 0 14px rgba(61,255,116,.35)}
.secret.imp{color:var(--imp);text-shadow:0 0 14px rgba(255,77,94,.35)}
.cluetab{width:100%;border-collapse:collapse;font-size:.92rem}
.cluetab th,.cluetab td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.cluetab th{font-family:var(--mono);font-weight:400;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.cluetab tr.now td{color:var(--led);font-weight:800}
.cluetab tr.imp td:first-child{color:var(--imp);font-weight:800}
.cluewrap{overflow-x:auto}
.chat{display:flex;flex-direction:column;gap:10px}
.chatlog{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:.92rem;overscroll-behavior:contain}
.chatlog .m{line-height:1.35;overflow-wrap:anywhere}
.chatlog .m b{color:var(--led);margin-right:6px}
.chatlog .m.me b{color:var(--warn)}
.chatlog .m.sys{color:var(--muted);font-family:var(--mono);font-size:.78rem}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hleft"><button class="back" id="backBtn" hidden>‹ Início</button><button class="brand" id="homeBtn" aria-label="Voltar ao início">Cronômetro <span>Impostor</span></button></div>
    <div class="hright"><span class="tag" id="roundTag">Início</span><button class="snd" id="sndBtn" aria-pressed="true">SOM ON</button></div>
  </header>
  <main id="screen"></main>
  <div class="box chat" id="chatBox" hidden>
    <h2>Conversa</h2>
    <div class="chatlog" id="chatLog" aria-live="polite"></div>
    <form class="inline" id="chatForm"><input type="text" id="chatInput" maxlength="200" placeholder="Escreva pra sala" autocomplete="off"><button class="ghost" type="submit">Enviar</button></form>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ms => ms == null ? '—' : (ms/1000).toFixed(2) + 's';
const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- seven-segment LED ---------- */
const SEG = {
  a:"12,4 48,4 52,8 48,12 12,12 8,8", b:"52,10 56,14 56,44 52,48 48,44 48,14", c:"52,52 56,56 56,86 52,90 48,86 48,56",
  d:"12,88 48,88 52,92 48,96 12,96 8,92", e:"8,52 12,56 12,86 8,90 4,86 4,56", f:"8,10 12,14 12,44 8,48 4,44 4,14",
  g:"12,46 48,46 52,50 48,54 12,54 8,50"
};
const MAP = {'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg','-':'g',' ':''};
function digit(ch){
  const on = MAP[ch] ?? '';
  return `<svg class="dg" viewBox="0 0 60 100" aria-hidden="true"><g transform="skewX(-6) translate(6 0)">${
    Object.keys(SEG).map(k=>`<polygon class="${on.includes(k)?'on':'off'}" points="${SEG[k]}"/>`).join('')}</g></svg>`;
}
function led(str, cls=''){
  let html='';
  for(const ch of str) html += ch==='.' ? `<svg class="dt" viewBox="0 0 14 100" aria-hidden="true"><circle class="on" cx="6" cy="91" r="5.5"/></svg>` : digit(ch);
  return `<div class="led ${cls}" role="img" aria-label="${str.includes('-')?'tempo escondido':str+' segundos'}">${html}</div>`;
}
const ledTime = ms => Math.min(ms/1000,99.99).toFixed(2).padStart(5,'0');

/* ---------- sound ---------- */
let ac=null, soundOn = store.get('ci-sound', true);
function beep(freq=1400, dur=.13){
  if(soundOn){
    try{
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended') ac.resume();
      const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
      o.type='square'; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+.008); g.gain.setValueAtTime(0.18,t+dur-.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.02);
    }catch(e){}
  }
  try{ navigator.vibrate && navigator.vibrate(40); }catch(e){}
}
function paintSound(){ const b=$('#sndBtn'); b.textContent = soundOn?'SOM ON':'SOM OFF'; b.setAttribute('aria-pressed', soundOn); }
$('#sndBtn').onclick = ()=>{ soundOn=!soundOn; store.set('ci-sound', soundOn); paintSound(); if(soundOn) beep(); };
paintSound();

/* ---------- stopwatch (push button + LED) ---------- */
let keyHandler=null, swTimer=null;
function stopSwTimer(){ if(swTimer){ clearInterval(swTimer); swTimer=null; } }
function stopwatch({ pre, label, onStop, show=false }){
  let t0=null, done=false;
  const html = `
    <div class="panel" id="panel">${pre}<div class="plabel">${label}</div></div>
    <div class="pushwrap"><button class="push" id="push" aria-label="Iniciar cronômetro"><span id="pushTxt">INICIAR</span></button></div>
    <p class="keyhint">Aperte o botão: <strong>pi</strong> e começa. Aperte de novo: <strong>pi</strong> e para.<br>Dá pra jogar de olhos fechados.</p>`;
  function bind(){
    const btn=$('#push');
    const press = () => {
      if(done) return;
      if(t0===null){
        t0=performance.now(); beep();
        btn.classList.add('on'); btn.setAttribute('aria-label','Parar cronômetro'); $('#pushTxt').textContent='PARAR';
        if(show){
          const paint = () => { const p=$('#panel'); if(p) p.innerHTML = led(ledTime(performance.now()-t0)) + `<div class="plabel">rodando · tempo visível</div>`; };
          paint(); stopSwTimer(); swTimer = setInterval(paint, 50);
        } else {
          $('#panel').innerHTML = led('--.--','blink') + `<div class="plabel">rodando · tempo escondido</div>`;
        }
      } else {
        const ms=performance.now()-t0; done=true; beep(); stopSwTimer();
        if(show) $('#panel').innerHTML = led(ledTime(ms)) + `<div class="plabel">parou aqui</div>`;
        btn.classList.remove('on'); btn.disabled=true; $('#pushTxt').textContent='OK';
        if(keyHandler){ document.removeEventListener('keydown', keyHandler); keyHandler=null; }
        onStop(ms);
      }
    };
    btn.addEventListener('pointerdown', e=>{ e.preventDefault(); btn.classList.add('pressed'); press(); });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>btn.classList.remove('pressed')));
    btn.addEventListener('click', e=>{ if(e.detail===0) press(); });
    if(keyHandler) document.removeEventListener('keydown', keyHandler);
    keyHandler = e=>{ if(e.code==='Space' && !e.repeat && document.activeElement!==btn && document.activeElement?.tagName!=='INPUT'){ e.preventDefault(); press(); } };
    document.addEventListener('keydown', keyHandler);
  }
  return { html, bind };
}

    <span class="t">${fmt(r.ms)}</span></div>`).join('')}</div>`;
}

const token = (() => { let t = store.get('ci-token', null); if(!t){ t = Array.from(crypto.getRandomValues(new Uint8Array(12)), b=>b.toString(16).padStart(2,'0')).join(''); store.set('ci-token', t); } return t; })();
const ON = { socket:null, code:null, state:null, list:[], step:null, stepRound:-1, deadlineAt:null, msg:'' };
let nick = store.get('ci-nick', '');

function connect(){
  if(ON.socket) return ON.socket;
  if(typeof io !== 'function'){ return null; }
  const s = ON.socket = io({ transports:['websocket','polling'] });
  s.on('connect', () => {
    if(ON.code) s.emit('join', { code:ON.code, nick, token }, res => {
      if(res?.error){ ON.code=null; store.set('ci-room', null); onlineMenu(res.error); }
      else resetChat(res.chat);
    });
    if(screenName==='menu') s.emit('watch-rooms', true);
    paintConn();
  });
  s.on('disconnect', paintConn);
  s.on('rooms', list => { ON.list = list; if(screenName==='menu') paintRoomList(); });
  s.on('state', st => { if(!ON.code) return; ON.state = st; ON.deadlineAt = st.remaining!=null ? Date.now()+st.remaining : null; renderRoom(); });
  s.on('chat', m => { if(ON.code) addChat(m); });
  s.on('kicked', msg => { ON.code=null; ON.state=null; store.set('ci-room', null); showChat(false); onlineMenu(msg); });
  return s;
}
function paintConn(){
  const el = $('#conn'); if(!el) return;
  el.textContent = ON.socket?.connected ? '' : 'Conectando ao servidor…';
}

function checkNick(){
  const v = ($('#nick')?.value || '').trim().slice(0,16);
  if(!v){ $('#menuErr').textContent='Escolha um apelido primeiro.'; $('#nick').focus(); return false; }
  nick = v; store.set('ci-nick', nick); return true;
}
function joinRoom(code){
  code = String(code||'').trim().toUpperCase();
  if(!checkNick()) return;
  if(!/^[A-Z]{4}$/.test(code)){ $('#menuErr').textContent='O código tem 4 letras.'; return; }
  ON.socket.emit('join', { code, nick, token }, onJoined);
}
function onJoined(res){
  if(res?.error){ const e=$('#menuErr'); if(e) e.textContent=res.error; return; }

  store.set('ci-room', { code: res.code, at: Date.now() });

}

/* ---- chat ---- */
function showChat(on){ $('#chatBox').hidden = !on; }

function addChat(m){
  const log=$('#chatLog'); const d=document.createElement('div');
  if(m.sys){ d.className='m sys'; d.textContent=m.text; }
  else { d.className='m'+(ON.state && m.pid===ON.state.me?' me':''); const b=document.createElement('b'); b.textContent=m.name; d.append(b, document.createTextNode(m.text)); }
  log.append(d); while(log.children.length>80) log.firstChild.remove();
  log.scrollTop = log.scrollHeight;
}

/* ---- room screens ---- */
function renderRoom(){
  const st = ON.state; if(!st) return;
  const me = st.players.find(p=>p.pid===st.me);
  if(st.phase==='lobby') return roomLobby(st);
  if(st.phase==='timing'){
    showChat(false);
    tag(`Rodada ${st.round}`);
    if(!st.role) return roomSpectate(st);
    if(st.myTime!=null) return roomWait(st);
    if(ON.stepRound!==st.round){ ON.stepRound=st.round; ON.step='role'; return roomRole(st); }
    if(ON.step==='role' && screenName!=='o-role') return roomRole(st);
    if(ON.step==='watch' && screenName!=='o-watch') return roomWatch(st);
    return; // don't disturb a running stopwatch
  }
  if(st.phase==='voting') return roomVote(st);
  if(st.phase==='reveal') return roomReveal(st);
}

function roomVote(st){
  showChat(true); tag(`Rodada ${st.round} · votação`);

  render(`<section>

function roomReveal(st){

  const R = st.reveal; const byPid = Object.fromEntries(st.players.map(p=>[p.pid,p]));
  const nm = pid => byPid[pid]?.name || 'alguém que saiu';
  const imps = R.impostors.map(pid=>`<strong style="color:var(--imp)">${esc(nm(pid))}</strong>`).join(' e ');

  render(`<section>

  const caught = WG.imps.has(WG.vote);
  const add=(p,n)=>W.scores[p]=(W.scores[p]||0)+n;
  S.players.forEach(p=>W.scores[p]=W.scores[p]||0);
  if(caught) S.players.filter(p=>!WG.imps.has(p)).forEach(p=>add(p,1));
  else WG.imps.forEach(p=>add(p,3));
  wPersist();
  const imps=[...WG.imps].map(esc).join(' e ');
  render(`<section>
    <div class="verdict" style="color:var(${caught?'--crew':'--imp'})">${caught?'Impostor eliminado! Tripulação vence.':'O impostor venceu!'}</div>
    <p class="center">Vocês eliminaram ${esc(WG.vote)}. ${WG.imps.size>1?'Os impostores eram':'O impostor era'} <strong style="color:var(--imp)">${imps}</strong>.</p>
    <div class="panel" style="padding-block:24px"><div class="plabel">a palavra era</div><div class="secret">${esc(WG.word)}</div><div class="plabel">tema: ${esc(WG.cat)}</div></div>
    <div class="box"><h2>Dicas</h2>${clueTable(null,true)}</div>
    <div class="box"><h2>Placar</h2><ul class="score">${[...S.players].sort((a,b)=>(W.scores[b]||0)-(W.scores[a]||0)).map(p=>`<li><span>${esc(p)}</span><span>${W.scores[p]||0}</span></li>`).join('')}</ul></div>
    <button class="btn" id="again">Próxima rodada</button>
    <button class="ghost" id="edit">Mudar jogadores ou temas</button>
  </section>`, 'w-reveal');
  $('#again').onclick=wordStart; $('#edit').onclick=wordSetup;
}

/* =====================================================================
   PÊNALTIS DO CRONÔMETRO (1 contra 1)
   ===================================================================== */
const P = Object.assign({ a: S.players[0]||'Jogador 1', b: S.players[1]||'Jogador 2', minT:3, maxT:10, show:false }, store.get('ci-pen', {}) || {});
const pPersist = () => store.set('ci-pen', P);
let PG = null;
const KICKS = 5;

function penBoard(highlight){
  const slots = Math.max(KICKS, PG.goals[0].length, PG.goals[1].length);
  const row = i => `<div class="penrow"><span class="pn">${esc(PG.names[i])}</span>
    <div class="balls">${Array.from({length:slots},(_,k)=>{ const g=PG.goals[i][k];
      return `<span class="ball ${g==null?(k===PG.goals[i].length&&highlight?'now':''):g?'g':'m'}">${g==null?'':g?'⚽':'✕'}</span>`; }).join('')}</div>
    <span class="pg">${PG.goals[i].filter(Boolean).length}</span></div>`;
  return `<div class="box pens">${row(0)}${row(1)}</div>`;
}
function penSetup(){
  tag('Pênaltis');
  render(`<section>
    <h1>Disputa de pênaltis no cronômetro</h1>
    <p>Cada rodada sorteia um tempo. Os dois param o cronômetro escondido, e quem chegar mais perto faz o gol. Cinco cobranças pra cada. Empatou? Alternadas até alguém errar.</p>
    <div class="box">
      <h2>Jogadores</h2>
      <div class="name-in"><input type="text" id="pa" maxlength="16" value="${esc(P.a)}" aria-label="Jogador 1"><input type="text" id="pb" maxlength="16" value="${esc(P.b)}" aria-label="Jogador 2"></div>
    </div>
    <div class="box">
      <div class="row"><span>Tempo sorteado entre</span><div class="step"><button data-r="-1" aria-label="Diminuir">−</button><output>${P.minT}–${P.maxT}s</output><button data-r="1" aria-label="Aumentar">+</button></div></div>
      ${showTimeRow(!!P.show, false)}
    </div>
    <button class="btn" id="start">Começar a disputa</button>
  </section>`, 'p-setup');
  const save = () => { P.a = $('#pa').value.trim() || 'Jogador 1'; P.b = $('#pb').value.trim() || 'Jogador 2'; pPersist(); };
  $$('[data-r]').forEach(b=>b.onclick=()=>{ save(); P.maxT=Math.max(P.minT+3,Math.min(60,P.maxT+(+b.dataset.r)*5)); pPersist(); penSetup(); });
  bindShow(v=>{ save(); P.show=v; pPersist(); penSetup(); });
  $('#start').onclick = () => {
    save();
    if(P.a.toLowerCase()===P.b.toLowerCase()) P.b += ' 2';
    PG = { names:[P.a,P.b], goals:[[],[]], round:0 };
    penRound();
  };
}
function penRound(){
  PG.round++;
  PG.target = randTarget(P.minT, P.maxT);
  PG.times = [null,null];
  PG.order = PG.round % 2 ? [0,1] : [1,0]; // alterna quem cobra primeiro
  PG.k = 0;
  penReady();
}
function penLabel(){ return PG.round<=KICKS ? `Cobrança ${PG.round} de ${KICKS}` : `Alternadas · cobrança ${PG.round}`; }
function penReady(){
  const i = PG.order[PG.k];
  tag(penLabel());
  render(`<section>
    ${penBoard(true)}
    <h2 class="center">${penLabel()}</h2>
    <div class="panel">${led(ledTime(PG.target))}<div class="plabel">tempo-alvo desta cobrança</div></div>
    ${PG.k===1?`<p class="center">${esc(PG.names[PG.order[0]])} já cobrou. O tempo dele fica escondido até o fim.</p>`:''}
    <div class="who">${esc(PG.names[i])}</div>
    <button class="btn" id="go">Sou ${esc(PG.names[i])}, vou cobrar</button>
  </section>`, 'p-ready');
  $('#go').onclick = () => penKick(i);
}
function penKick(i){
  const sw = stopwatch({ pre: led(ledTime(PG.target)), label:`alvo · vez de ${esc(PG.names[i])}`, show: !!P.show, onStop: ms => {
    PG.times[i] = ms; PG.k++;
    setTimeout(()=> PG.k<2 ? penReady() : penResult(), P.show?1200:600);
  }});
  render(`<section>${sw.html}</section>`, 'p-kick');
  sw.bind();
}
function penResult(){
  const d = PG.times.map(t=>Math.abs(t-PG.target));
  let w = d[0]<d[1] ? 0 : d[1]<d[0] ? 1 : -1; // -1: empate exato, os dois marcam
  PG.goals[0].push(w!==1); PG.goals[1].push(w!==0);
  const g = PG.goals.map(x=>x.filter(Boolean).length);
  const done = PG.goals[0].length, left = Math.max(0, KICKS-done);
  let over = false;
  if(done < KICKS){ if(g[0] > g[1]+left || g[1] > g[0]+left) over = true; }
  else if(g[0]!==g[1]) over = true;
  try{ beep(w===-1?900:1700, .25); }catch(e){}
  tag(penLabel());
  render(`<section>
    <div class="goal">${w===-1?'DOIS GOLS!':'GOOOL!'}</div>
    <p class="center">${w===-1?'Empate exato, os dois marcaram.':`<strong style="color:var(--fg)">${esc(PG.names[w])}</strong> chegou mais perto e fez o gol. ${esc(PG.names[1-w])} perdeu.`}</p>
    <div class="duel">${[0,1].map(i=>`<div class="${w===i||w===-1?'win':''}"><b>${esc(PG.names[i])}</b><span class="t">${fmt(PG.times[i])}</span><small>${(d[i]/1000).toFixed(2)}s de diferença</small></div>`).join('')}</div>
    <p class="center hint">Alvo era ${ledTime(PG.target)}s.</p>
    ${penBoard(false)}
    <button class="btn" id="next">${over?'Ver o campeão':done===KICKS-1&&!over?'Última cobrança':done>=KICKS?'Alternadas: próxima cobrança':'Próxima cobrança'}</button>
  </section>`, 'p-result');
  $('#next').onclick = () => over ? penEnd() : penRound();
}
function penEnd(){
  const g = PG.goals.map(x=>x.filter(Boolean).length);
  const w = g[0]>g[1]?0:1;
  tag('Pênaltis · fim');
  try{ beep(1200,.12); setTimeout(()=>beep(1600,.12),160); setTimeout(()=>beep(2000,.3),320); }catch(e){}
  render(`<section>
    <div class="panel"><div class="plabel">placar final</div>${led(String(g[0]).slice(-1)+' '+String(g[1]).slice(-1))}<div class="plabel">${esc(PG.names[0])} × ${esc(PG.names[1])}</div></div>
    <div class="verdict" style="color:var(--led)">${esc(PG.names[w])} é campeão!</div>
    <p class="center">Venceu por ${g[w]} a ${g[1-w]}${PG.goals[0].length>KICKS?' nas alternadas':''}.</p>
    ${penBoard(false)}
    <button class="btn" id="again">Revanche</button>
    <button class="ghost" id="edit">Mudar jogadores</button>
  </section>`, 'p-end');
  $('#again').onclick = () => { PG = { names:PG.names, goals:[[],[]], round:0 }; penRound(); };
  $('#edit').onclick = penSetup;
}

const GQ = Object.assign({ rounds:5, scores:{} }, store.get('ci-guess', {}) || {});
GQ.scores = GQ.scores || {};
const gPersist = () => store.set('ci-guess', GQ);
let GG = null;
const MAXPTS = 6;

function guessSetup(){
  tag('Adivinhe');
  render(`<section>
    <h1>Adivinhe o jogador</h1>
    <p>O site mostra uma dica por vez. Quem acertar primeiro, em voz alta, ganha os pontos. Quanto menos dicas precisar, mais pontos: 6 na primeira dica, 1 na última.</p>
    <div class="box">
      <h2>Jogadores (${S.players.length})</h2>
      <ul class="players">${S.players.map((p,i)=>`<li><span class="n">${String(i+1).padStart(2,'0')}</span><span class="name">${esc(p)}</span><button class="x" aria-label="Remover ${esc(p)}" data-rm="${i}">×</button></li>`).join('')}</ul>
      <form class="add" id="addForm"><input type="text" id="newName" placeholder="Nome do jogador" maxlength="18" autocomplete="off"><button class="ghost" type="submit">Adicionar</button></form>
    </div>
    <div class="box"><div class="row"><span>Jogadores pra adivinhar</span><div class="step"><button data-st="-1" aria-label="Menos">−</button><output>${GQ.rounds}</output><button data-st="1" aria-label="Mais">+</button></div></div></div>
    <button class="btn" id="start" ${S.players.length<1?'disabled':''}>Começar</button>
  </section>`, 'g-setup');
  $('#addForm').onsubmit = e => { e.preventDefault(); const v=$('#newName').value.trim(); if(v && !S.players.includes(v)){S.players.push(v);persist();guessSetup();$('#newName').focus();} };
  $$('[data-rm]').forEach(b=>b.onclick=()=>{S.players.splice(+b.dataset.rm,1);persist();guessSetup();});
  $$('[data-st]').forEach(b=>b.onclick=()=>{ GQ.rounds=Math.max(1,Math.min(PLAYERS.length,GQ.rounds+(+b.dataset.st))); gPersist(); guessSetup(); });
  $('#start').onclick = () => {
    GG = { deck: shuffle([...PLAYERS]).slice(0, GQ.rounds), i:0, shown:1, pts:Object.fromEntries(S.players.map(p=>[p,0])) };
    guessRound();
  };
}
function guessRound(){
  const P1 = GG.deck[GG.i];
  tag(`Adivinhe · ${GG.i+1}/${GG.deck.length}`);
  const pts = MAXPTS - GG.shown + 1;
  render(`<section>
    <h2 class="center">Jogador ${GG.i+1} de ${GG.deck.length}</h2>
    <h1 class="center">Quem é?</h1>
    <ol class="clues">${P1.c.slice(0,GG.shown).map((c,k)=>`<li class="${k===GG.shown-1?'new':''}"><span class="cn">${k+1}</span><span>${esc(c)}</span></li>`).join('')}</ol>
    <p class="pts">Vale ${pts} ${pts>1?'pontos':'ponto'} agora</p>
    <div class="box"><h2>Quem acertou?</h2>
      <div class="vote">${S.players.map(p=>`<button data-hit="${esc(p)}">${esc(p)}</button>`).join('')}</div></div>
    ${GG.shown<P1.c.length ? `<button class="btn" id="more">Mais uma dica</button>` : `<button class="btn red" id="none">Ninguém acertou, mostrar resposta</button>`}
  </section>`, 'g-round');
  $$('[data-hit]').forEach(b=>b.onclick=()=>guessReveal(b.dataset.hit, pts));
  const m=$('#more'); if(m) m.onclick=()=>{ GG.shown++; guessRound(); };
  const n=$('#none'); if(n) n.onclick=()=>guessReveal(null,0);
}
function guessReveal(who, pts){
  const P1 = GG.deck[GG.i];
  if(who){ GG.pts[who]=(GG.pts[who]||0)+pts; GQ.scores[who]=(GQ.scores[who]||0)+pts; gPersist(); }
  const last = GG.i===GG.deck.length-1;
  render(`<section>
    <div class="panel" style="padding-block:24px"><div class="plabel">era</div><div class="secret" style="color:#c79bff;text-shadow:none">${esc(P1.n)}</div></div>
    <p class="center">${who?`<strong style="color:var(--fg)">${esc(who)}</strong> acertou com ${GG.shown} ${GG.shown>1?'dicas':'dica'} e ganhou ${pts} ${pts>1?'pontos':'ponto'}.`:'Ninguém acertou essa.'}</p>
    <div class="box"><h2>Placar desta partida</h2><ul class="score">${Object.keys(GG.pts).sort((a,b)=>GG.pts[b]-GG.pts[a]).map(p=>`<li><span>${esc(p)}</span><span>${GG.pts[p]}</span></li>`).join('')}</ul></div>
    <button class="btn" id="next">${last?'Ver o vencedor':'Próximo jogador'}</button>
  </section>`, 'g-reveal');
  $('#next').onclick = () => { if(last) return guessEnd(); GG.i++; GG.shown=1; guessRound(); };
}
function guessEnd(){
  tag('Adivinhe · fim');
  const ranked = Object.keys(GG.pts).sort((a,b)=>GG.pts[b]-GG.pts[a]);
  const top = ranked[0], tie = ranked.length>1 && GG.pts[ranked[1]]===GG.pts[top];
  render(`<section>
    <div class="verdict" style="color:#c79bff">${GG.pts[top]===0?'Ninguém pontuou!':tie?'Deu empate!':`${esc(top)} venceu!`}</div>
    <div class="box"><h2>Placar final</h2><ul class="score">${ranked.map(p=>`<li><span>${esc(p)}</span><span>${GG.pts[p]}</span></li>`).join('')}</ul></div>
    <button class="btn" id="again">Jogar de novo</button>
    <button class="ghost" id="edit">Mudar jogadores</button>
  </section>`, 'g-end');
  $('#again').onclick = () => { GG = { deck: shuffle([...PLAYERS]).slice(0, GQ.rounds), i:0, shown:1, pts:Object.fromEntries(S.players.map(p=>[p,0])) }; guessRound(); };
  $('#edit').onclick = guessSetup;
}

/* =====================================================================
   TREINO
   ===================================================================== */
let soloHist = store.get('ci-solo', []) || [];
let soloTarget = 0;
function solo(newTarget){
  if(newTarget) soloTarget = randTarget(S.minT, S.maxT);
  tag('Treino');
  const show = !!S.soloShow;
  const sw = stopwatch({ pre: led(ledTime(soloTarget)), label:'tempo-alvo · segundos', show, onStop: ms => setTimeout(()=>soloResult(ms), show?700:350) });
  render(`<section>
    ${sw.html}
    <div class="box"><div class="row"><span>Tempo sorteado entre</span>
      <div class="step"><button data-r="-1" aria-label="Diminuir">−</button><output>${S.minT}–${S.maxT}s</output><button data-r="1" aria-label="Aumentar">+</button></div></div>
      ${showTimeRow(show, false)}</div>
    ${statsHtml()}
  </section>`, 'solo');
  sw.bind();
  bindShow(v=>{ S.soloShow=v; persist(); solo(false); });
  $$('[data-r]').forEach(b=>b.onclick=()=>{ S.maxT=Math.max(S.minT+4,Math.min(60,S.maxT+(+b.dataset.r)*5)); persist(); solo(true); });
}
function soloResult(ms){
  const err = ms - soloTarget, a = Math.abs(err)/1000;
  soloHist.unshift({t:soloTarget, e:err}); soloHist = soloHist.slice(0,50); store.set('ci-solo', soloHist);
  const [g,c] = a<0.1?['Perfeito!','--crew']:a<0.3?['Muito bom','--crew']:a<0.7?['Quase','--fg']:['Longe','--imp'];
  render(`<section>
    <div class="grade" style="color:var(${c})">${g}</div>
    <div class="panel">${led(ledTime(ms), a<0.7?'':'red')}<div class="plabel">seu tempo · alvo ${soloTarget/1000}s</div></div>
    <p class="center">Você parou <strong style="color:var(--fg)">${a.toFixed(2)}s ${err>0?'depois':'antes'}</strong> do tempo.</p>
    <button class="btn" id="again">Novo tempo</button>
    <button class="ghost" id="same">Repetir ${soloTarget/1000}s</button>
    ${statsHtml()}
  </section>`, 'solo-res');
  $('#again').onclick=()=>solo(true); $('#same').onclick=()=>solo(false);
}
function statsHtml(){
  if(!soloHist.length) return '';
  const errs = soloHist.map(h=>Math.abs(h.e)/1000);
  const n = Math.min(10,errs.length), avg = errs.slice(0,n).reduce((s,x)=>s+x,0)/n;
  return `<div class="box"><h2>Seu treino</h2><div class="stats">
    <div><b>${soloHist.length}</b><span>tentativas</span></div>
    <div><b>${Math.min(...errs).toFixed(2)}s</b><span>melhor erro</span></div>
    <div><b>${avg.toFixed(2)}s</b><span>erro médio (últ. ${n})</span></div></div></div>`;
}

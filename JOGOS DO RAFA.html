  render(`<section>
    <div class="panel">${led(ledTime(LTG.target))}<div class="plabel">tempo-alvo desta rodada</div></div>
    <div class="bid">${LTG.leader ? `<span>promessa</span><b>${LTG.bid.toFixed(2)}s</b><span>de ${esc(LTG.leader)}</span>` : `<span>quem promete errar menos de</span><b>1,00s</b><span>?</span>`}</div>
    <div class="bidders">${S.players.map(w=>{ const isLead = LTG.leader===w; return `<div class="bidder ${isLead?'lead':''}">
      <span class="bn">${esc(w)}${isLead?' 🔨':''}</span><span class="bm">${LTG.pts[w]}/${LT.goal} pts</span>
      <div class="bb">${steps.map(d=>{ const v = Math.round((LTG.bid - d)*100)/100; return `<button data-lt="${esc(w)}:${v}" ${v<0.01||isLead?'disabled':''}>−${d.toFixed(2)}</button>`; }).join('')}</div></div>`; }).join('')}</div>
    <button class="hammer" id="hammer" ${LTG.leader?'':'disabled'}>${LTG.leader?`Fechou: ${esc(LTG.leader)} promete errar menos de ${LTG.bid.toFixed(2)}s`:'Ninguém promete?'}</button>
    ${LTG.leader?'':'<button class="ghost" id="skip">Ninguém quer, sortear outro tempo</button>'}
  </section>`, 'lt-bid');
  $$('[data-lt]').forEach(b=>b.onclick=()=>{ const [w,v]=b.dataset.lt.split(':'); LTG.bid=+v; LTG.leader=w; try{ beep(1300,.05); }catch(e){} ltBid(); });
  $('#hammer').onclick = ltKick;
  const s=$('#skip'); if(s) s.onclick = () => { LTG.round--; ltRound(); };
}
function ltKick(){
  const w = LTG.leader, promise = LTG.bid*1000;
  render(`<section class="center"><h2>Hora de cumprir</h2><div class="who">${esc(w)}</div><p>Prometeu errar menos de <strong style="color:var(--fg)">${LTG.bid.toFixed(2)}s</strong> no alvo de ${ledTime(LTG.target)}s.</p><button class="btn" id="go">Sou ${esc(w)}, vou cumprir</button></section>`, 'lt-ready');
  $('#go').onclick = () => {
    const sw = stopwatch({ pre: led(ledTime(LTG.target)), label:`alvo · promessa ${LTG.bid.toFixed(2)}s`, onStop: ms => {
      const err = Math.abs(ms-LTG.target), ok = err <= promise;
      if(ok) LTG.pts[w] += 2; else S.players.filter(p=>p!==w).forEach(p=>LTG.pts[p]+=1);
      try{ beep(ok?1700:400,.3); }catch(e){}
      setTimeout(()=>{
        const last = Object.values(LTG.pts).some(v=>v>=LT.goal);
        render(`<section>
          <div class="verdict" style="color:var(${ok?'--led':'--imp'})">${ok?'Cumpriu!':'Falhou!'}</div>
          <div class="panel">${led(ledTime(ms), ok?'':'red')}<div class="plabel">errou ${(err/1000).toFixed(2)}s · prometeu ${LTG.bid.toFixed(2)}s</div></div>
          <p class="center">${ok?`<strong style="color:var(--fg)">${esc(w)}</strong> segurou a promessa e leva 2 pontos.`:`${esc(w)} prometeu demais. Todo mundo menos ele ganha 1 ponto.`}</p>
          <div class="box"><h2>Placar · vence com ${LT.goal}</h2><ul class="score">${Object.keys(LTG.pts).sort((a,b)=>LTG.pts[b]-LTG.pts[a]).map(p=>`<li><span>${esc(p)}</span><span>${LTG.pts[p]}</span></li>`).join('')}</ul></div>
          <button class="btn" id="next">${last?'Ver o campeão':'Próxima rodada'}</button>
        </section>`, 'lt-res');
        $('#next').onclick = () => last ? ltEnd() : ltRound();
      }, 500);
    }});
    render(`<section>${sw.html}</section>`, 'lt-kick'); sw.bind();
  };
}
function ltEnd(){
  const r = Object.keys(LTG.pts).sort((a,b)=>LTG.pts[b]-LTG.pts[a]);
  celebrate({ sub:'rei das promessas', name:r[0], detail:`${LTG.pts[r[0]]} pontos`, btn:'Ver o placar', onNext: () => {
    render(`<section><div class="box"><h2>Placar final</h2><ul class="score">${r.map(p=>`<li><span>${esc(p)}</span><span>${LTG.pts[p]}</span></li>`).join('')}</ul></div>
      <button class="btn" id="again">Jogar de novo</button><button class="ghost" id="edit">Mudar jogadores</button></section>`, 'lt-end');
    $('#again').onclick = () => { LTG = { round:0, pts:Object.fromEntries(S.players.map(p=>[p,0])) }; ltRound(); }; $('#edit').onclick = ltSetup;
  }});
}

/* =====================================================================
   MENTIROSO DO TEMPO
   ===================================================================== */
const MT = Object.assign({ rounds:5, minT:3, maxT:10 }, store.get('ci-ment', {}) || {});
let MG = null;
function mentSetup(){
  tag('Mentiroso');
  render(`<section>
    <h1>Mentiroso do tempo</h1>
    <p>Todo mundo tenta o mesmo tempo-alvo no cronômetro escondido. Só você vê o seu resultado, e aí você <strong style="color:var(--fg)">declara</strong> quanto deu, podendo mentir. Quem declarar o tempo mais perto do alvo ganha 2 pontos. Mas a galera pode gritar "Mentira!" em uma declaração: se era mentira, quem acusou ganha 2 e o mentiroso fica de fora; se era verdade, o acusado ganha 2 e quem acusou perde 1.</p>
    <div class="box">
      <h2>Jogadores (${S.players.length})</h2>
      <ul class="players">${S.players.map((p,i)=>`<li><span class="n">${String(i+1).padStart(2,'0')}</span><span class="name">${esc(p)}</span><button class="x" aria-label="Remover ${esc(p)}" data-rm="${i}">×</button></li>`).join('')}</ul>
      <form class="add" id="addForm"><input type="text" id="newName" placeholder="Nome do jogador" maxlength="18" autocomplete="off"><button class="ghost" type="submit">Adicionar</button></form>
    </div>
    <div class="box">
      <div class="row"><span>Rodadas</span><div class="step"><button data-mr="-1" aria-label="Menos">−</button><output>${MT.rounds}</output><button data-mr="1" aria-label="Mais">+</button></div></div>
      <div class="row"><span>Tempo sorteado entre</span><div class="step"><button data-mx="-1" aria-label="Diminuir">−</button><output>${MT.minT}–${MT.maxT}s</output><button data-mx="1" aria-label="Aumentar">+</button></div></div>
      <p class="hint">Mentira é qualquer declaração que fuja mais de 0,05s do tempo de verdade.</p>
    </div>
    <button class="btn" id="start" ${S.players.length<2?'disabled':''}>${S.players.length<2?'Precisa de 2 jogadores':'Começar'}</button>
  </section>`, 'mt-setup');
  $('#addForm').onsubmit = e => { e.preventDefault(); const v=$('#newName').value.trim(); if(v && !S.players.includes(v)){S.players.push(v);persist();mentSetup();$('#newName').focus();} };
  $$('[data-rm]').forEach(b=>b.onclick=()=>{S.players.splice(+b.dataset.rm,1);persist();mentSetup();});
  $$('[data-mr]').forEach(b=>b.onclick=()=>{ MT.rounds=Math.max(1,Math.min(15,MT.rounds+(+b.dataset.mr))); store.set('ci-ment',MT); mentSetup(); });
  $$('[data-mx]').forEach(b=>b.onclick=()=>{ MT.maxT=Math.max(MT.minT+3,Math.min(60,MT.maxT+(+b.dataset.mx)*5)); store.set('ci-ment',MT); mentSetup(); });
  $('#start').onclick = () => { MG = { round:0, pts:Object.fromEntries(S.players.map(p=>[p,0])) }; mentRound(); };
}
function mentRound(){
  MG.round++; MG.target = randTarget(MT.minT, MT.maxT); MG.order = shuffle([...S.players]); MG.idx = 0; MG.res = {};
  mentPass();
}
function mentPass(){
  tag(`Mentiroso · ${MG.round}/${MT.rounds}`);
  const p = MG.order[MG.idx];
  render(`<section class="center">
    <div class="panel">${led(ledTime(MG.target))}<div class="plabel">tempo-alvo · todo mundo tenta esse</div></div>
    <h2>Passe o celular para</h2><div class="who">${esc(p)}</div>
    <p>${MG.idx} de ${MG.order.length} já declararam.</p>
    <button class="btn" id="go">Sou ${esc(p)}, vou cronometrar</button>
  </section>`, 'mt-pass');
  $('#go').onclick = () => {
    const sw = stopwatch({ pre: led(ledTime(MG.target)), label:`alvo · vez de ${esc(p)}`, onStop: ms => setTimeout(()=>mentDeclare(p, ms), 400) });
    render(`<section>${sw.html}</section>`, 'mt-kick'); sw.bind();
  };
}
function mentDeclare(p, ms){
  const s = Math.floor(ms/1000), c = Math.round((ms%1000)/10);
  render(`<section>
    <h2 class="center">Só ${esc(p)} vê isso</h2>
    <div class="panel">${led(ledTime(ms))}<div class="plabel">seu tempo de verdade · alvo ${ledTime(MG.target)}s</div></div>
    <p class="center">Agora declare pra galera quanto deu. Pode falar a verdade… ou não.</p>
    <form id="decl" class="box"><h2>Eu declaro que fiz</h2>
      <div class="timein"><input type="number" id="ds" min="0" max="99" inputmode="numeric" value="${s}" aria-label="segundos"><span class="dot">.</span><input type="number" id="dc" min="0" max="99" inputmode="numeric" value="${String(c).padStart(2,'0')}" aria-label="centésimos"></div>
      <p class="hint">segundos . centésimos (ex.: 6 . 85)</p>
      <button class="btn" type="submit">Declarar e esconder</button></form>
  </section>`, 'mt-decl');
  $('#decl').onsubmit = e => {
    e.preventDefault();
    const d = (Math.max(0,Math.min(99,+$('#ds').value||0)))*1000 + Math.max(0,Math.min(99,+$('#dc').value||0))*10;
    MG.res[p] = { real: ms, said: d, lie: Math.abs(d-ms) > 50 };
    MG.idx++; MG.idx < MG.order.length ? mentPass() : mentClaims();
  };
}
function mentClaims(){
  tag(`Mentiroso · acusações`);
  const T = MG.target;
  const rows = MG.order.map(p=>({ p, said:MG.res[p].said, d:Math.abs(MG.res[p].said-T) })).sort((a,b)=>a.d-b.d);
  render(`<section>
    <h1 class="center">Quem está mentindo?</h1>
    <div class="panel">${led(ledTime(T))}<div class="plabel">alvo</div></div>
    <div class="box"><h2>Declarações (do mais perto ao mais longe)</h2><div class="claims">${rows.map((r,i)=>`<div class="claim ${i===0?'best':''}"><span class="cn">${esc(r.p)}</span><span class="ct">${fmt(r.said)}</span><span class="cr">erro ${(r.d/1000).toFixed(2)}s</span></div>`).join('')}</div></div>
    <p class="center">Alguém grita "Mentira!"? Toque no acusado. Se ninguém acusar, o mais perto leva.</p>
    <div class="vote">${rows.map(r=>`<button data-acc="${esc(r.p)}">Mentira, ${esc(r.p)}!</button>`).join('')}</div>
    <button class="btn" id="none">Ninguém acusa, acreditamos</button>
  </section>`, 'mt-claims');
  $$('[data-acc]').forEach(b=>b.onclick=()=>mentWho(b.dataset.acc));
  $('#none').onclick = () => mentResolve(null, null);
}
function mentWho(acc){
  render(`<section><h1 class="center">Quem acusou ${esc(acc)}?</h1>
    <div class="vote">${S.players.filter(x=>x!==acc).map(x=>`<button data-by="${esc(x)}">${esc(x)}</button>`).join('')}</div>
    <button class="ghost" id="back">Voltar</button></section>`, 'mt-who');
  $$('[data-by]').forEach(b=>b.onclick=()=>mentResolve(acc, b.dataset.by));
  $('#back').onclick = mentClaims;
}
function mentResolve(acc, by){
  const T = MG.target, R = MG.res;
  let msg = '';
  let excluded = null;
  if(acc){
    if(R[acc].lie){ MG.pts[by] += 2; excluded = acc; msg = `<strong style="color:var(--imp)">${esc(acc)} mentiu!</strong> Disse ${fmt(R[acc].said)}, mas fez ${fmt(R[acc].real)}. ${esc(by)} ganha 2 pontos e ${esc(acc)} fica fora da disputa.`; }
    else { MG.pts[acc] += 2; MG.pts[by] -= 1; msg = `<strong style="color:var(--led)">${esc(acc)} falou a verdade!</strong> Fez ${fmt(R[acc].real)} mesmo. ${esc(acc)} ganha 2 pontos e ${esc(by)} perde 1 pela acusação.`; }
  }
  const cands = MG.order.filter(p=>p!==excluded).sort((a,b)=>Math.abs(R[a].said-T)-Math.abs(R[b].said-T));
  const best = cands[0];
  if(best){ MG.pts[best] += 2; }
  try{ beep(acc && R[acc].lie ? 400 : 1600, .3); }catch(e){}
  const last = MG.round >= MT.rounds;
  render(`<section>
    <div class="verdict" style="color:var(--warn)">${best?`${esc(best)} chegou mais perto`:'Ninguém pontuou'}</div>
    ${msg?`<p class="center">${msg}</p>`:''}
    <p class="center">${best?`Declaração de ${esc(best)} (${fmt(R[best].said)}) foi a mais perto do alvo${excluded?' entre quem sobrou':''}: +2 pontos.`:''}</p>
    <div class="box"><h2>O que cada um disse e o que fez de verdade</h2><div class="claims">${MG.order.map(p=>`<div class="claim ${R[p].lie?'lie':'true'} ${p===best?'best':''}"><span class="cn">${esc(p)}</span><span class="ct">disse ${fmt(R[p].said)}</span><span class="cr">fez de verdade ${fmt(R[p].real)}${R[p].lie?' · mentiu':' · verdade'}${p===excluded?' · pego!':''}</span></div>`).join('')}</div></div>
    <div class="box"><h2>Placar</h2><ul class="score">${Object.keys(MG.pts).sort((a,b)=>MG.pts[b]-MG.pts[a]).map(p=>`<li><span>${esc(p)}</span><span>${MG.pts[p]}</span></li>`).join('')}</ul></div>
    <button class="btn" id="next">${last?'Ver o campeão':'Próxima rodada'}</button>
  </section>`, 'mt-res');
  $('#next').onclick = () => last ? mentEnd() : mentRound();
}
function mentEnd(){
  const r = Object.keys(MG.pts).sort((a,b)=>MG.pts[b]-MG.pts[a]);
  celebrate({ sub:'o maior cara de pau', name:r[0], detail:`${MG.pts[r[0]]} pontos`, btn:'Ver o placar', onNext: () => {
    render(`<section><div class="box"><h2>Placar final</h2><ul class="score">${r.map(p=>`<li><span>${esc(p)}</span><span>${MG.pts[p]}</span></li>`).join('')}</ul></div>
      <button class="btn" id="again">Jogar de novo</button><button class="ghost" id="edit">Mudar jogadores</button></section>`, 'mt-end');
    $('#again').onclick = () => { MG = { round:0, pts:Object.fromEntries(S.players.map(p=>[p,0])) }; mentRound(); }; $('#edit').onclick = mentSetup;
  }});
}

/* =====================================================================
   TREINO
   ===================================================================== */
let soloHist = store.get('ci-solo', []) || [];
let soloTarget = 0;
function solo(newTarget){
  if(newTarget) soloTarget = randTarget(S.minT, S.maxT);
  tag('Treino');
  const show = !!S.soloShow;
  const sw = stopwatch({ pre: led(ledTime(soloTarget)), label:'tempo-alvo · segundos', show, onStop: ms => setTimeout(()=>soloResult(ms), show?700:350) });
  render(`<section>
    ${sw.html}
    <div class="box"><div class="row"><span>Tempo sorteado entre</span>
      <div class="step"><button data-r="-1" aria-label="Diminuir">−</button><output>${S.minT}–${S.maxT}s</output><button data-r="1" aria-label="Aumentar">+</button></div></div>
      ${showTimeRow(show, false)}</div>
    ${statsHtml()}
  </section>`, 'solo');
  sw.bind();
  bindShow(v=>{ S.soloShow=v; persist(); solo(false); });
  $$('[data-r]').forEach(b=>b.onclick=()=>{ S.maxT=Math.max(S.minT+4,Math.min(60,S.maxT+(+b.dataset.r)*5)); persist(); solo(true); });
}
function soloResult(ms){
  const err = ms - soloTarget, a = Math.abs(err)/1000;
  soloHist.unshift({t:soloTarget, e:err}); soloHist = soloHist.slice(0,50); store.set('ci-solo', soloHist);
  const [g,c] = a<0.1?['Perfeito!','--crew']:a<0.3?['Muito bom','--crew']:a<0.7?['Quase','--fg']:['Longe','--imp'];
  render(`<section>
    <div class="grade" style="color:var(${c})">${g}</div>
    <div class="panel">${led(ledTime(ms), a<0.7?'':'red')}<div class="plabel">seu tempo · alvo ${soloTarget/1000}s</div></div>
    <p class="center">Você parou <strong style="color:var(--fg)">${a.toFixed(2)}s ${err>0?'depois':'antes'}</strong> do tempo.</p>
    <button class="btn" id="again">Novo tempo</button>
    <button class="ghost" id="same">Repetir ${soloTarget/1000}s</button>
    ${statsHtml()}
  </section>`, 'solo-res');
  $('#again').onclick=()=>solo(true); $('#same').onclick=()=>solo(false);
}
function statsHtml(){
  if(!soloHist.length) return '';
  const errs = soloHist.map(h=>Math.abs(h.e)/1000);
  const n = Math.min(10,errs.length), avg = errs.slice(0,n).reduce((s,x)=>s+x,0)/n;
  return `<div class="box"><h2>Seu treino</h2><div class="stats">
    <div><b>${soloHist.length}</b><span>tentativas</span></div>
    <div><b>${Math.min(...errs).toFixed(2)}s</b><span>melhor erro</span></div>
    <div><b>${avg.toFixed(2)}s</b><span>erro médio (últ. ${n})</span></div></div></div>`;
}

/* ---------- boot ---------- */
home();
</script>
</body>
</html>

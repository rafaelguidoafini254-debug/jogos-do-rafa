<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c100f">
<title>Jogos do Rafa</title>
<meta name="description" content="Jogos do Rafa: impostor do cronômetro, impostor da palavra, adivinhe o jogador, pênaltis do cronômetro e treino. Tudo num celular só, pra jogar com a galera.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Chivo+Mono:wght@400;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='38' fill='%23050706' stroke='%233dff74' stroke-width='8'/%3E%3Crect x='42' y='4' width='16' height='12' rx='3' fill='%233dff74'/%3E%3Cpath d='M50 55 L50 30' stroke='%233dff74' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Layout: one centered column, one screen at a time — a black LED timer panel and a big arcade push button */
:root{
  --bg:#0c100f; --panel:#151b19; --line:#26302c; --fg:#e9f2ec; --muted:#8ea197;
  --led:#3dff74; --led-off:rgba(61,255,116,.07); --ink:#04140a;
  --crew:#3dff74; --imp:#ff4d5e; --warn:#ffc53d;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --mono:"Chivo Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);font-size:16px;padding-inline:16px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background-image:radial-gradient(circle at 50% -10%,#14261c 0,transparent 55%);background-attachment:fixed}
.app{max-width:460px;margin:0 auto;padding-block:16px 32px;min-height:100%;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hleft{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-weight:800;font-size:1.1rem;background:none;color:var(--fg);padding:0;white-space:nowrap}
.brand span{color:var(--led)}
.back{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:8px 12px;font-weight:800;font-size:.95rem;white-space:nowrap}
.app:has(#backBtn:not([hidden])) .brand{display:none}
.hright{display:flex;align-items:center;gap:10px}
.tag{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.hleft{flex-shrink:0}
.snd{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:6px 10px;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em}
section{display:flex;flex-direction:column;gap:16px}
h1{font-size:2rem;line-height:1.05;margin:0;text-wrap:balance;font-weight:800}
h2{font-size:.78rem;margin:0;font-family:var(--mono);font-weight:400;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
p{margin:0;color:var(--muted);line-height:1.5}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--led);outline-offset:3px}
.btn{background:var(--led);color:var(--ink);font-weight:800;font-size:1.1rem;padding:16px;width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.red{background:var(--imp);color:#1a0306}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);padding:12px 14px;font-weight:500}
.ghost:disabled{opacity:.4}
.players{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.players li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:10px;border:1px solid var(--line);min-height:46px}
.players li.off{opacity:.45}
.players li .n{font-family:var(--mono);color:var(--muted);font-size:.8rem;width:1.6em}
.players li .name{flex:1;min-width:0;overflow-wrap:anywhere}
.players li .badge{font-family:var(--mono);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.players li .badge.ok{color:var(--led)}
.x{background:transparent;color:var(--muted);font-size:1.3rem;line-height:1;padding:2px 8px}
.add,.inline{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px}
input.code{font-family:var(--mono);text-transform:uppercase;letter-spacing:.3em;font-size:1.2rem;text-align:center}
label.lbl{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;background:var(--bg);color:var(--fg);border:1px solid var(--line);font-size:1.2rem}
.step button:disabled{opacity:.3}
.step output{font-family:var(--mono);font-weight:700;min-width:4.4em;text-align:center;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{background:transparent;color:var(--muted);padding:10px;font-weight:800}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.hint{font-size:.85rem}
.err{color:var(--imp);font-size:.9rem}
.err:empty{display:none}
.center{text-align:center}

/* LED panel */
.panel{background:#050706;border-radius:12px;padding:18px 16px 12px;border:1px solid #1d2622;
  box-shadow:inset 0 0 0 4px #0f1412, 0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;gap:8px}
.led{display:flex;align-items:flex-end;justify-content:center;gap:2%;width:100%;max-width:340px}
.led svg{height:auto;display:block}
.led .dg{width:21%}
.led .dt{width:5%}
.led .on{fill:var(--led);filter:drop-shadow(0 0 4px var(--led))}
.led .off{fill:var(--led-off)}
.led.red .on{fill:var(--imp);filter:drop-shadow(0 0 4px var(--imp))}
.led.blink .on{animation:blink 1s steps(2,start) infinite}
.led.code .dg{width:23%}
@keyframes blink{to{opacity:.25}}
.plabel{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:center}
.bigcode{font-family:var(--mono);font-weight:700;font-size:3rem;letter-spacing:.25em;color:var(--led);text-shadow:0 0 12px rgba(61,255,116,.5);padding-left:.25em}

/* arcade push button */
.pushwrap{display:grid;place-items:center;padding-block:8px}
.push{width:min(58vw,220px);aspect-ratio:1;border-radius:50%;position:relative;color:var(--ink);font-weight:800;font-size:1.3rem;letter-spacing:.06em;
  background:#111;padding:14px;box-shadow:0 8px 0 #000, 0 14px 30px rgba(0,0,0,.6);touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.push span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 40% 30%,#c9ffd9 0,var(--led) 35%,#13a845 100%);
  box-shadow:0 0 30px rgba(61,255,116,.45), inset 0 -8px 16px rgba(0,0,0,.25);transition:transform .06s}
.push.on span{background:radial-gradient(circle at 40% 30%,#ffd0d5 0,var(--imp) 35%,#a8152a 100%);box-shadow:0 0 34px rgba(255,77,94,.5), inset 0 -8px 16px rgba(0,0,0,.25);color:#1a0306}
.push:active span,.push.pressed span{transform:translateY(4px) scale(.97)}
.push:disabled{cursor:default;opacity:.6}
.keyhint{font-size:.8rem;text-align:center}
@media (prefers-reduced-motion:reduce){.led.blink .on{animation:none}.push span{transition:none}}

.role{font-size:2.2rem;font-weight:800;text-align:center;line-height:1}
.role.imp{color:var(--imp)}
.who{font-size:2.6rem;font-weight:800;color:var(--led);text-align:center;overflow-wrap:anywhere}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,7em) 1fr auto;align-items:center;gap:10px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:14px;background:var(--bg);border-radius:7px;position:relative;border:1px solid var(--line)}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--muted)}
.bar.imp .fill{background:var(--imp)}
.bar.crew .fill{background:var(--crew)}
.bar .t{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.9rem}
.target{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg)}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vote button{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:14px 10px;overflow-wrap:anywhere}
.vote button[aria-pressed=true]{border-color:var(--imp);background:var(--imp);color:#1a0306;font-weight:800}
.vote button:disabled:not([aria-pressed=true]){opacity:.45}
.vote .skip{grid-column:1/-1;background:transparent;color:var(--muted)}
.score{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.score li{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.verdict{font-size:1.8rem;font-weight:800;text-align:center;text-wrap:balance}
.rules{font-size:.9rem}
.rules ol{margin:0;padding-left:1.2em;color:var(--muted);line-height:1.55;display:flex;flex-direction:column;gap:4px}
.modes{display:flex;flex-direction:column;gap:12px}
.mode{background:var(--panel);border:1px solid var(--line);color:var(--fg);text-align:left;padding:20px;display:flex;flex-direction:column;gap:6px}
.mode:hover{border-color:var(--led)}
.mode .mt{font-size:1.5rem;font-weight:800}
.mode .md{color:var(--muted);line-height:1.45}
.mode.online .mt{color:var(--warn)} .mode.imp .mt{color:var(--imp)} .mode.solo .mt{color:var(--led)}
.grade{font-size:2rem;font-weight:800;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 4px}
.stats b{display:block;font-family:var(--mono);font-size:1.2rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.75rem;color:var(--muted)}
.roomlist{display:flex;flex-direction:column;gap:8px}
.roomitem{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--fg);text-align:left;width:100%}
.roomitem .rn{flex:1;min-width:0;font-weight:800;overflow-wrap:anywhere}
.roomitem .rs{font-family:var(--mono);font-size:.75rem;color:var(--muted);white-space:nowrap}
.roomitem .go{color:var(--led);font-weight:800;white-space:nowrap}
.roomitem:disabled{opacity:.5}
.empty{color:var(--muted);text-align:center;padding:12px;font-size:.9rem}
.pill{display:inline-block;font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.pub{color:var(--warn);border-color:rgba(255,197,61,.4)}
.pill.priv{color:var(--led);border-color:rgba(61,255,116,.35)}
.cd{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--warn)}
.conn{font-family:var(--mono);font-size:.75rem;color:var(--warn);text-align:center}
/* chat */
.mode.word .mt{color:#7cc4ff}

/* ---------- HOME: arcade lobby ---------- */
:root{ --arcade:"Bungee","Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --c-imp:#ff4d5e; --c-word:#4fb3ff; --c-guess:#b07cff; --c-pen:#ffc53d; --c-solo:#3dff74; }
.app{position:relative;z-index:1}
.fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fx i{position:absolute;display:block;width:10px;height:10px;border-radius:2px;opacity:.55;animation:drift 14s linear infinite}
.fx i:nth-child(3n){border-radius:50%}
.fx i:nth-child(4n){width:6px;height:16px}
@keyframes drift{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-12vh) rotate(540deg)}}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:6px}
.sign{font-family:var(--arcade);font-weight:400;line-height:.92;margin:0;font-size:clamp(2.8rem,15vw,4.4rem);letter-spacing:.01em;transform:rotate(-3deg)}
.sign .l1{display:block;color:var(--fg);text-shadow:0 0 18px rgba(255,255,255,.18)}
.sign .l2{display:block;color:var(--led);text-shadow:0 0 6px var(--led),0 0 26px rgba(61,255,116,.55);animation:neon 4s infinite}
@keyframes neon{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.45}}
.tagline{font-size:1.05rem;color:var(--muted);max-width:30ch}
.tagline b{color:var(--fg)}
.miniled{cursor:pointer;width:100%;border:0;font:inherit;color:inherit;transition:transform .08s}
.miniled:active{transform:scale(.98)}
.miniled .plabel b{color:var(--warn);font-weight:700}
.miniled.hit{box-shadow:inset 0 0 0 4px #0f1412,0 0 0 3px var(--led),0 10px 30px rgba(0,0,0,.5)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:16px 14px 14px;border-radius:18px;color:var(--fg);min-width:0;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 28%,var(--panel)) 0%,var(--panel) 70%);
  border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));
  box-shadow:0 6px 0 color-mix(in srgb,var(--c) 35%,#000),0 12px 24px rgba(0,0,0,.35);
  transition:transform .12s ease, box-shadow .12s ease;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.tile:nth-child(2){animation-delay:.06s}.tile:nth-child(3){animation-delay:.12s}.tile:nth-child(4){animation-delay:.18s}.tile:nth-child(5){animation-delay:.24s}
@keyframes pop{from{transform:translateY(14px) scale(.94)}to{transform:none}}
.tile:hover{transform:translateY(-3px)}
.tile:active,.tile.pick{transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 35%,#000),0 4px 10px rgba(0,0,0,.35)}
.tile.flash{outline:3px solid var(--c);outline-offset:2px}
.tile.wide{grid-column:1/-1}
.tile .ti{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.tile .ti svg{width:28px;height:28px}
.tile .tt{font-family:var(--arcade);font-size:1.02rem;line-height:1.08;color:var(--c);text-wrap:balance}
.tile .td{font-size:.86rem;color:var(--muted);line-height:1.35}
.tile .tb{margin-top:auto;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));color:var(--c)}
.tile .new{position:absolute;top:12px;right:-30px;transform:rotate(35deg);background:var(--c);color:#1a1300;font-family:var(--arcade);font-size:.7rem;padding:3px 34px}
.t-imp{--c:var(--c-imp)} .t-word{--c:var(--c-word)} .t-guess{--c:var(--c-guess)} .t-pen{--c:var(--c-pen)} .t-solo{--c:var(--c-solo)}
.surprise{font-family:var(--arcade);font-size:1.15rem;background:linear-gradient(90deg,var(--c-imp),var(--c-pen),var(--c-solo),var(--c-word),var(--c-guess));background-size:300% 100%;color:#0c100f;padding:16px;width:100%;border-radius:14px;animation:slide 6s linear infinite;box-shadow:0 6px 0 #000}
.surprise:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
@keyframes slide{to{background-position:300% 0}}
.strip{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.strip span::before{content:"● ";color:var(--led)}
@media (max-width:340px){.tiles{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.fx{display:none}.sign .l2,.tile,.surprise{animation:none}}
.mode.pen .mt{color:var(--warn)}
.mode.guess .mt{color:#c79bff}
.t-dv{--c:#ff8a3d}
.t-lau{--c:#5ee6c3}
.t-lt{--c:#ffd166}
.t-ment{--c:#ff7eb6}
.claims{display:flex;flex-direction:column;gap:8px}
.claim{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.claim .cn{font-weight:800;overflow-wrap:anywhere}
.claim .ct{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.claim .cr{font-family:var(--mono);font-size:.78rem;color:var(--muted);grid-column:1/-1}
.claim.lie{border-color:var(--imp)} .claim.lie .ct{color:var(--imp)}
.claim.true{border-color:var(--led)} .claim.true .ct{color:var(--led)}
.claim.best{box-shadow:inset 0 0 0 1px var(--warn);border-color:var(--warn)}
.timein{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.timein input{font-family:var(--mono);font-size:1.6rem;text-align:center;padding:10px;min-width:0;width:100%}
.timein .dot{font-family:var(--mono);font-size:1.6rem}
.scorebig{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.scorebig b{font-size:1rem;overflow-wrap:anywhere}
.scorebig .sc{font-family:var(--arcade);font-size:2.6rem;color:var(--warn);font-variant-numeric:tabular-nums}
.table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.85rem}
.table th,.table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
.table th:first-child,.table td:first-child{text-align:left;font-family:var(--display);font-weight:800}
.table th{font-weight:400;color:var(--muted);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.lot{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-block:22px}
.lot .ln{font-family:var(--arcade);font-size:1.7rem;line-height:1.05;color:var(--fg);text-wrap:balance}
.lot .lp{font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lot .lr{font-family:var(--mono);font-size:2.2rem;font-weight:700;color:#5ee6c3;line-height:1}
.bid{display:flex;align-items:baseline;justify-content:center;gap:10px;font-family:var(--mono)}
.bid b{font-size:2.4rem;color:var(--warn);font-variant-numeric:tabular-nums}
.bid span{color:var(--muted)}
.bidders{display:flex;flex-direction:column;gap:10px}
.bidder{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bidder.lead{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.bidder.out{opacity:.45}
.bidder .bn{font-weight:800;overflow-wrap:anywhere}
.bidder .bm{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.bidder .bm b{color:#5ee6c3}
.bidder .bb{display:flex;gap:6px;grid-column:1/-1}
.bidder .bb button{flex:1;background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:10px 4px;font-family:var(--mono);font-weight:700}
.bidder .bb button:disabled{opacity:.3}
.hammer{background:var(--warn);color:#1a1300;font-weight:800;font-size:1.1rem;padding:16px;width:100%;border-radius:12px;box-shadow:0 5px 0 #8a6a0c}
.hammer:active{transform:translateY(3px);box-shadow:0 2px 0 #8a6a0c}
.hammer:disabled{opacity:.4;box-shadow:none}
.pitches{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.pitchwrap{display:flex;flex-direction:column;gap:6px;min-width:0;border-radius:14px;padding:6px;border:1px solid transparent}
.pitchwrap.lead{border-color:var(--warn)}
.pth{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-inline:4px}
.pth b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pth .money{font-family:var(--mono);font-weight:700;color:#5ee6c3;font-variant-numeric:tabular-nums;white-space:nowrap}
.pitch{position:relative;aspect-ratio:3/5;max-width:100%;border-radius:10px;background:#1f3a5c;border:3px solid #cfe3ff;overflow:visible}
.pitch .box6{position:absolute;left:28%;width:44%;height:16%;border:2px solid #cfe3ff;border-top:0}
.pitch .box6.top{top:-2px;border-top:0;border-bottom:2px solid #cfe3ff}
.pitch .box6.bot{bottom:-2px;border-top:2px solid #cfe3ff;border-bottom:0}
.pitch .mid{position:absolute;left:0;right:0;top:50%;border-top:2px solid #cfe3ff}
.pitch .circle{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;border:2px solid #cfe3ff;border-radius:50%;transform:translate(-50%,-50%)}
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:48%;text-align:center}
.spot .face{width:36px;height:36px;border-radius:50%;background:#0b1424;border:3px solid #ff2d6f;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:.85rem;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.spot .face.fill{border-color:#8ea197;color:#8ea197}
.spot b{font-size:.66rem;line-height:1.05;color:#fff;text-shadow:0 1px 3px #000;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot i{font-style:normal;font-family:var(--mono);font-size:.6rem;color:#cfe3ff}
.spot.empty .face{background:rgba(255,255,255,.06);border:2px dashed rgba(255,255,255,.5);color:rgba(255,255,255,.7);font-size:.62rem}
.spot.empty.hot .face{border-color:#5ee6c3;color:#5ee6c3;box-shadow:0 0 12px rgba(94,230,195,.6)}
.spot.empty.hot b{color:#5ee6c3}

/* ---------- revelação do campeão ---------- */
.rv{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.rv-title{font-family:var(--arcade);text-align:center;font-size:1.5rem;color:var(--muted);min-height:1.6em}
.rv-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;animation:rvin .55s cubic-bezier(.2,1.4,.4,1) both}
.rv-card .rk{font-family:var(--arcade);font-size:1.4rem;color:var(--muted);width:1.6em}
.rv-card .nm{font-weight:800;font-size:1.1rem;overflow-wrap:anywhere}
.rv-card .nt{font-family:var(--mono);font-weight:700;font-size:1.5rem;color:var(--fg);font-variant-numeric:tabular-nums}
.rv-card.gold{border-color:var(--warn);background:linear-gradient(160deg,rgba(255,197,61,.22),var(--panel) 70%);box-shadow:0 0 0 1px var(--warn),0 0 30px rgba(255,197,61,.25)}
.rv-card.gold .rk,.rv-card.gold .nt{color:var(--warn)}
@keyframes rvin{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}
.champ-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:10px;animation:rvin .6s both}
.trophy{width:120px;height:120px;animation:pop .9s cubic-bezier(.2,1.6,.4,1) both, sway 2.4s ease-in-out .9s infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.champ-name{font-family:var(--arcade);font-size:clamp(2rem,11vw,3rem);line-height:1;text-align:center;color:var(--warn);text-shadow:0 0 10px rgba(255,197,61,.6),0 0 40px rgba(255,197,61,.35);animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{to{text-shadow:0 0 18px rgba(255,197,61,.9),0 0 60px rgba(255,197,61,.5)}}
.champ-sub{font-family:var(--mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:.75rem}
.burst{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.burst i{position:absolute;top:-4vh;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(3px,1px)}}
@media (prefers-reduced-motion:reduce){.rv-card,.champ-wrap,.trophy,.champ-name{animation:none}.burst{display:none}}
@media (max-width:360px){.pitches{grid-template-columns:1fr 1fr}.spot .face{width:34px;height:34px}}
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chain .lk{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;padding:8px 6px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.chain .lk b{font-size:.78rem;overflow-wrap:anywhere;text-align:center;max-width:9ch}
.chain .lk small{font-size:.65rem}
.chain .lk span{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1rem}
.chain .lk.hid span{color:var(--muted);letter-spacing:.1em}
.chain .lk.bad{border-color:var(--imp);box-shadow:inset 0 0 0 1px var(--imp)}
.chain .lk.bad span{color:var(--imp)}
.chain .lk.ok span{color:var(--led)}
.chain .lk.last{border-color:var(--warn)}
.chain .arrow{color:var(--muted)}
.doubt{background:#ff8a3d;color:#1a0a00;font-weight:800;font-size:1.1rem;padding:16px;width:100%;border-radius:12px;box-shadow:0 5px 0 #8a3f0c}
.doubt:active{transform:translateY(3px);box-shadow:0 2px 0 #8a3f0c}
.clues{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none;counter-reset:c}
.clues li{display:flex;gap:12px;align-items:baseline;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;line-height:1.35}
.clues li .cn{font-family:var(--mono);color:#c79bff;font-weight:700;min-width:1.4em}
.clues li.new{border-color:#c79bff}
.pts{font-family:var(--mono);color:var(--warn);text-align:center}
.name-in{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pens{display:flex;flex-direction:column;gap:12px}
.penrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px}
.penrow .pn{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.penrow .pg{font-family:var(--mono);font-weight:700;font-size:1.6rem;color:var(--warn);font-variant-numeric:tabular-nums}
.balls{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ball{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:800}
.ball.g{background:var(--led);border-color:var(--led);color:var(--ink)}
.ball.m{background:transparent;border-color:var(--imp);color:var(--imp)}
.ball.now{border-color:var(--warn);box-shadow:0 0 0 3px rgba(255,197,61,.25)}
.goal{font-size:3rem;font-weight:800;text-align:center;color:var(--led);letter-spacing:.04em;line-height:1}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duel div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;min-width:0}
.duel div.win{border-color:var(--led);box-shadow:inset 0 0 0 1px var(--led)}
.duel b{display:block;overflow-wrap:anywhere}
.duel .t{display:block;font-family:var(--mono);font-size:1.3rem;font-variant-numeric:tabular-nums}
.duel small{display:block;color:var(--muted);font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);color:var(--muted);border:1px solid var(--line);padding:8px 12px;border-radius:99px;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--led);color:var(--ink);border-color:var(--led);font-weight:800}
.secret{font-size:2.6rem;font-weight:800;text-align:center;color:var(--led);overflow-wrap:anywhere;line-height:1.05;text-shadow:0 0 14px rgba(61,255,116,.35)}
.secret.imp{color:var(--imp);text-shadow:0 0 14px rgba(255,77,94,.35)}
.cluetab{width:100%;border-collapse:collapse;font-size:.92rem}
.cluetab th,.cluetab td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.cluetab th{font-family:var(--mono);font-weight:400;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.cluetab tr.now td{color:var(--led);font-weight:800}
.cluetab tr.imp td:first-child{color:var(--imp);font-weight:800}
.cluewrap{overflow-x:auto}
.chat{display:flex;flex-direction:column;gap:10px}
.chatlog{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:.92rem;overscroll-behavior:contain}
.chatlog .m{line-height:1.35;overflow-wrap:anywhere}
.chatlog .m b{color:var(--led);margin-right:6px}
.chatlog .m.me b{color:var(--warn)}
.chatlog .m.sys{color:var(--muted);font-family:var(--mono);font-size:.78rem}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hleft"><button class="back" id="backBtn" hidden>‹ Início</button><button class="brand" id="homeBtn" aria-label="Voltar ao início">Jogos do <span>Rafa</span></button></div>
    <div class="hright"><span class="tag" id="roundTag">Início</span><button class="snd" id="sndBtn" aria-pressed="true">SOM ON</button></div>
  </header>
  <main id="screen"></main>
  <div class="box chat" id="chatBox" hidden>
    <h2>Conversa</h2>
    <div class="chatlog" id="chatLog" aria-live="polite"></div>
    <form class="inline" id="chatForm"><input type="text" id="chatInput" maxlength="200" placeholder="Escreva pra sala" autocomplete="off"><button class="ghost" type="submit">Enviar</button></form>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ms => ms == null ? '—' : (ms/1000).toFixed(2) + 's';
const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- seven-segment LED ---------- */
const SEG = {
  a:"12,4 48,4 52,8 48,12 12,12 8,8", b:"52,10 56,14 56,44 52,48 48,44 48,14", c:"52,52 56,56 56,86 52,90 48,86 48,56",
  d:"12,88 48,88 52,92 48,96 12,96 8,92", e:"8,52 12,56 12,86 8,90 4,86 4,56", f:"8,10 12,14 12,44 8,48 4,44 4,14",
  g:"12,46 48,46 52,50 48,54 12,54 8,50"
};
const MAP = {'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg','-':'g',' ':''};
function digit(ch){
  const on = MAP[ch] ?? '';
  return `<svg class="dg" viewBox="0 0 60 100" aria-hidden="true"><g transform="skewX(-6) translate(6 0)">${
    Object.keys(SEG).map(k=>`<polygon class="${on.includes(k)?'on':'off'}" points="${SEG[k]}"/>`).join('')}</g></svg>`;
}
function led(str, cls=''){
  let html='';
  for(const ch of str) html += ch==='.' ? `<svg class="dt" viewBox="0 0 14 100" aria-hidden="true"><circle class="on" cx="6" cy="91" r="5.5"/></svg>` : digit(ch);
  return `<div class="led ${cls}" role="img" aria-label="${str.includes('-')?'tempo escondido':str+' segundos'}">${html}</div>`;
}
const ledTime = ms => Math.min(ms/1000,99.99).toFixed(2).padStart(5,'0');

/* ---------- sound ---------- */
let ac=null, soundOn = store.get('ci-sound', true);
function beep(freq=1400, dur=.13){
  if(soundOn){
    try{
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended') ac.resume();
      const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
      o.type='square'; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+.008); g.gain.setValueAtTime(0.18,t+dur-.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.02);
    }catch(e){}
  }
  try{ navigator.vibrate && navigator.vibrate(40); }catch(e){}
}
function paintSound(){ const b=$('#sndBtn'); b.textContent = soundOn?'SOM ON':'SOM OFF'; b.setAttribute('aria-pressed', soundOn); }
$('#sndBtn').onclick = ()=>{ soundOn=!soundOn; store.set('ci-sound', soundOn); paintSound(); if(soundOn) beep(); };
paintSound();

/* ---------- stopwatch (push button + LED) ---------- */
let keyHandler=null, swTimer=null;
function stopSwTimer(){ if(swTimer){ clearInterval(swTimer); swTimer=null; } }
function stopwatch({ pre, label, onStop, show=false }){
  let t0=null, done=false;
  const html = `
    <div class="panel" id="panel">${pre}<div class="plabel">${label}</div></div>
    <div class="pushwrap"><button class="push" id="push" aria-label="Iniciar cronômetro"><span id="pushTxt">INICIAR</span></button></div>
    <p class="keyhint">Aperte o botão: <strong>pi</strong> e começa. Aperte de novo: <strong>pi</strong> e para.<br>Dá pra jogar de olhos fechados.</p>`;
  function bind(){
    const btn=$('#push');
    const press = () => {
      if(done) return;
      if(t0===null){
        t0=performance.now(); beep();
        btn.classList.add('on'); btn.setAttribute('aria-label','Parar cronômetro'); $('#pushTxt').textContent='PARAR';
        if(show){
          const paint = () => { const p=$('#panel'); if(p) p.innerHTML = led(ledTime(performance.now()-t0)) + `<div class="plabel">rodando · tempo visível</div>`; };
          paint(); stopSwTimer(); swTimer = setInterval(paint, 50);
        } else {
          $('#panel').innerHTML = led('--.--','blink') + `<div class="plabel">rodando · tempo escondido</div>`;
        }
      } else {
        const ms=performance.now()-t0; done=true; beep(); stopSwTimer();
        if(show) $('#panel').innerHTML = led(ledTime(ms)) + `<div class="plabel">parou aqui</div>`;
        btn.classList.remove('on'); btn.disabled=true; $('#pushTxt').textContent='OK';
        if(keyHandler){ document.removeEventListener('keydown', keyHandler); keyHandler=null; }
        onStop(ms);
      }
    };
    btn.addEventListener('pointerdown', e=>{ e.preventDefault(); btn.classList.add('pressed'); press(); });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>btn.classList.remove('pressed')));
    btn.addEventListener('click', e=>{ if(e.detail===0) press(); });
    if(keyHandler) document.removeEventListener('keydown', keyHandler);
    keyHandler = e=>{ if(e.code==='Space' && !e.repeat && document.activeElement!==btn && document.activeElement?.tagName!=='INPUT'){ e.preventDefault(); press(); } };
    document.addEventListener('keydown', keyHandler);
  }
  return { html, bind };
}

/* ---------- shared bits ---------- */
function bars(rows, target){
  const vals = rows.map(r=>r.ms||0);
  const max = Math.max(target||0, ...vals, 1000) * 1.1;
  return `<div class="bars">${rows.map(r=>`<div class="bar ${r.cls||''}">
    <span class="nm">${esc(r.name)}</span>
    <span class="track">${r.ms!=null?`<span class="fill" style="width:${r.ms/max*100}%"></span>`:''}${target?`<span class="target" style="left:${target/max*100}%"></span>`:''}</span>
    <span class="t">${fmt(r.ms)}</span></div>`).join('')}</div>`;
}
let screenName='home';
var heroTimer = null;
const render = (html, name) => {
  if(keyHandler){ document.removeEventListener('keydown',keyHandler); keyHandler=null; }
  stopSwTimer();
  if(heroTimer){ clearInterval(heroTimer); heroTimer=null; }
  screenName = name || '';
  $('#screen').innerHTML = html;
  if(typeof tickCountdown==='function') tickCountdown();
};
const tag = t => $('#roundTag').textContent = t;
const randTarget = (minT,maxT) => (minT + Math.floor(Math.random()*(maxT-minT+1)))*1000;
// "Mostrar o tempo correndo" toggle row; readonly shows the value only
function showTimeRow(on, readonly){
  return `<div class="row"><span>Mostrar o tempo correndo</span>${readonly
    ? `<span class="pill ${on?'pub':''}">${on?'Sim':'Não'}</span>`
    : `<div class="seg" role="group" aria-label="Mostrar o tempo correndo" style="min-width:150px"><button type="button" data-show="0" aria-pressed="${!on}">Não</button><button type="button" data-show="1" aria-pressed="${on}">Sim</button></div>`}</div>
    <p class="hint">${on?'O visor mostra os segundos correndo. Fica bem mais fácil.':'O visor fica escondido. Você conta de cabeça.'}</p>`;
}
const bindShow = fn => $$('[data-show]').forEach(b=>b.onclick=()=>fn(b.dataset.show==='1'));

/* ---------- navigation ---------- */
let pushed=false;
function enterMode(fn){ if(!pushed){ try{ history.pushState({ci:1},''); pushed=true; }catch(e){} } $('#backBtn').hidden=false; fn(); }
function goHome(){ if(pushed){ try{ history.back(); return; }catch(e){} } home(); }
window.addEventListener('popstate', ()=>{ pushed=false; home(); });
$('#backBtn').onclick = goHome;
$('#homeBtn').onclick = goHome;

/* ---------- HOME ---------- */
function home(){
  if(ON.code) onlineLeave(true);
  showChat(false);
  $('#backBtn').hidden = true;
  tag('Bora jogar');
  const IC = {
    imp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M10 2.5h4M18.5 6.5l1.5-1.5"/></svg>',
    word:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M10 9.2a2 2 0 1 1 2.6 1.9c-.5.2-.6.6-.6 1"/><circle cx="12" cy="13.6" r=".4" fill="currentColor"/></svg>',
    guess:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="7.5" r="4"/><path d="M4 21c.8-4.2 4-6.5 8-6.5s7.2 2.3 8 6.5"/></svg>',
    pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l3.4 2.5-1.3 4h-4.2l-1.3-4z" fill="currentColor"/><path d="M12 3v4.5M20.6 9.3l-5.2.7M17.5 19.5l-3.4-5.5M6.5 19.5l3.4-5.5M3.4 9.3l5.2.7"/></svg>',
    solo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>',
  };
  render(`<section>
    <div class="hero">
      <h1 class="sign"><span class="l1">Jogos</span><span class="l2">do Rafa</span></h1>
      <p class="tagline">Um celular, a galera reunida e <b>zero desculpa</b> pra não jogar.</p>
    </div>
    <button class="panel miniled" id="heroLed" aria-label="Desafio rápido: pare o cronômetro no 10">
      ${led('00.00')}<div class="plabel" id="heroLbl">desafio rápido · toque pra parar no <b>10.00</b></div>
    </button>
    <div class="tiles" id="tiles">
      <button class="tile t-pen wide" id="mPen"><span class="new">NOVO</span><span class="ti">${IC.pen}</span><span class="tt">Pênaltis do cronômetro</span><span class="td">Para o tempo mais perto do alvo que o rival e estufa a rede. Cinco cobranças pra cada.</span><span class="tb">1 contra 1</span></button>
      <button class="tile t-imp" id="mImp"><span class="ti">${IC.imp}</span><span class="tt">Impostor do cronômetro</span><span class="td">Todo mundo sabe o tempo. Um tá blefando.</span><span class="tb">3+ jogadores</span></button>
      <button class="tile t-word" id="mWord"><span class="ti">${IC.word}</span><span class="tt">Impostor da palavra</span><span class="td">Cachorro? "Ração." Avião?! Pega o impostor.</span><span class="tb">3+ jogadores</span></button>
      <button class="tile t-guess" id="mGuess"><span class="ti">${IC.guess}</span><span class="tt">Adivinhe o jogador</span><span class="td">Quantas dicas você precisa pra cravar o craque?</span><span class="tb">Futebol</span></button>
      <button class="tile t-dv" id="mDv"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-7-7 18-2-8z"/></svg></span><span class="tt">Duvido!</span><span class="td">Um cronômetro que vai somando no escuro. Não deixa a soma estourar. Se duvidarem, abre o jogo.</span><span class="tb">3+ jogadores</span></button>
      <button class="tile t-lau" id="mLau"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-8 8-6-6z"/><path d="M4 20l5-5M12 6l6 6"/></svg></span><span class="tt">Leilão de craques</span><span class="td">R$ 50 no bolso e um campinho pra encher: goleiro, zagueiro, 2 meias e atacante. Dá o lance, bate o martelo.</span><span class="tb">2 a 3 jogadores</span></button>

const token = (() => { let t = store.get('ci-token', null); if(!t){ t = Array.from(crypto.getRandomValues(new Uint8Array(12)), b=>b.toString(16).padStart(2,'0')).join(''); store.set('ci-token', t); } return t; })();
const ON = { socket:null, code:null, state:null, list:[], step:null, stepRound:-1, deadlineAt:null, msg:'' };
let nick = store.get('ci-nick', '');

function connect(){
  if(ON.socket) return ON.socket;
  if(typeof io !== 'function'){ return null; }
  const s = ON.socket = io({ transports:['websocket','polling'] });
  s.on('connect', () => {
    if(ON.code) s.emit('join', { code:ON.code, nick, token }, res => {
      if(res?.error){ ON.code=null; store.set('ci-room', null); onlineMenu(res.error); }
      else resetChat(res.chat);
    });
    if(screenName==='menu') s.emit('watch-rooms', true);
    paintConn();
  });
  s.on('disconnect', paintConn);
  s.on('rooms', list => { ON.list = list; if(screenName==='menu') paintRoomList(); });
  s.on('state', st => { if(!ON.code) return; ON.state = st; ON.deadlineAt = st.remaining!=null ? Date.now()+st.remaining : null; renderRoom(); });
  s.on('chat', m => { if(ON.code) addChat(m); });
  s.on('kicked', msg => { ON.code=null; ON.state=null; store.set('ci-room', null); showChat(false); onlineMenu(msg); });
  return s;
}
function paintConn(){
  const el = $('#conn'); if(!el) return;
  el.textContent = ON.socket?.connected ? '' : 'Conectando ao servidor…';
}

  paintConn(); paintRoomList();

function checkNick(){
  const v = ($('#nick')?.value || '').trim().slice(0,16);
  if(!v){ $('#menuErr').textContent='Escolha um apelido primeiro.'; $('#nick').focus(); return false; }
  nick = v; store.set('ci-nick', nick); return true;

function joinRoom(code){

function renderRoom(){
  const st = ON.state; if(!st) return;
  const me = st.players.find(p=>p.pid===st.me);
  if(st.phase==='lobby') return roomLobby(st);
  if(st.phase==='timing'){
    showChat(false);
    tag(`Rodada ${st.round}`);
    if(!st.role) return roomSpectate(st);
    if(st.myTime!=null) return roomWait(st);
    if(ON.stepRound!==st.round){ ON.stepRound=st.round; ON.step='role'; return roomRole(st); }
    if(ON.step==='role' && screenName!=='o-role') return roomRole(st);
    if(ON.step==='watch' && screenName!=='o-watch') return roomWatch(st);
    return; // don't disturb a running stopwatch

  if(st.phase==='voting') return roomVote(st);
  if(st.phase==='reveal') return roomReveal(st);

function localReveal(){
  tag(`Rodada ${S.round} · resultado`);
  const caught = G.imps.has(G.vote);
  const add=(p,n)=>S.scores[p]=(S.scores[p]||0)+n;
  S.players.forEach(p=>S.scores[p]=S.scores[p]||0);

  const crew = S.players.filter(p=>!G.imps.has(p));
  const best = crew.reduce((a,b)=>Math.abs(G.times[b]-G.target)<Math.abs(G.times[a]-G.target)?b:a);

  const caught = WG.imps.has(WG.vote);
  const add=(p,n)=>W.scores[p]=(W.scores[p]||0)+n;
  S.players.forEach(p=>W.scores[p]=W.scores[p]||0);
  if(caught) S.players.filter(p=>!WG.imps.has(p)).forEach(p=>add(p,1));
  else WG.imps.forEach(p=>add(p,3));
  wPersist();
  const imps=[...WG.imps].map(esc).join(' e ');
  render(`<section>
    <div class="verdict" style="color:var(${caught?'--crew':'--imp'})">${caught?'Impostor eliminado! Tripulação vence.':'O impostor venceu!'}</div>

    <div class="panel" style="padding-block:24px"><div class="plabel">a palavra era</div><div class="secret">${esc(WG.word)}</div><div class="plabel">tema: ${esc(WG.cat)}</div></div>

/* =====================================================================
   PÊNALTIS DO CRONÔMETRO (1 contra 1)
   ===================================================================== */
const P = Object.assign({ a: S.players[0]||'Jogador 1', b: S.players[1]||'Jogador 2', minT:3, maxT:10, show:false }, store.get('ci-pen', {}) || {});
const pPersist = () => store.set('ci-pen', P);
let PG = null;
const KICKS = 5;

function penBoard(highlight){
  const slots = Math.max(KICKS, PG.goals[0].length, PG.goals[1].length);
  const row = i => `<div class="penrow"><span class="pn">${esc(PG.names[i])}</span>
    <div class="balls">${Array.from({length:slots},(_,k)=>{ const g=PG.goals[i][k];
      return `<span class="ball ${g==null?(k===PG.goals[i].length&&highlight?'now':''):g?'g':'m'}">${g==null?'':g?'⚽':'✕'}</span>`; }).join('')}</div>
    <span class="pg">${PG.goals[i].filter(Boolean).length}</span></div>`;
  return `<div class="box pens">${row(0)}${row(1)}</div>`;
}
function penSetup(){
  tag('Pênaltis');
  render(`<section>
    <h1>Disputa de pênaltis no cronômetro</h1>
    <p>Cada rodada sorteia um tempo e os dois param o cronômetro escondido. Quem errar por menos faz o gol. Se os dois errarem exatamente igual, os dois marcam. Cinco cobranças pra cada, e se empatar no placar vai pras alternadas.</p>
    <div class="box">
      <h2>Jogadores</h2>
      <div class="name-in"><input type="text" id="pa" maxlength="16" value="${esc(P.a)}" aria-label="Jogador 1"><input type="text" id="pb" maxlength="16" value="${esc(P.b)}" aria-label="Jogador 2"></div>
    </div>
    <div class="box">
      <div class="row"><span>Tempo sorteado entre</span><div class="step"><button data-r="-1" aria-label="Diminuir">−</button><output>${P.minT}–${P.maxT}s</output><button data-r="1" aria-label="Aumentar">+</button></div></div>
      ${showTimeRow(!!P.show, false)}
    </div>
    <button class="btn" id="start">Começar a disputa</button>
  </section>`, 'p-setup');
  const save = () => { P.a = $('#pa').value.trim() || 'Jogador 1'; P.b = $('#pb').value.trim() || 'Jogador 2'; pPersist(); };
  $$('[data-r]').forEach(b=>b.onclick=()=>{ save(); P.maxT=Math.max(P.minT+3,Math.min(60,P.maxT+(+b.dataset.r)*5)); pPersist(); penSetup(); });
  bindShow(v=>{ save(); P.show=v; pPersist(); penSetup(); });
  $('#start').onclick = () => {
    save();
    if(P.a.toLowerCase()===P.b.toLowerCase()) P.b += ' 2';
    PG = { names:[P.a,P.b], goals:[[],[]], round:0 };
    penRound();
  };
}
function penRound(){
  PG.round++;
  PG.target = randTarget(P.minT, P.maxT);
  PG.times = [null,null];
  PG.order = PG.round % 2 ? [0,1] : [1,0]; // alterna quem cobra primeiro
  PG.k = 0;
  penReady();
}
function penLabel(){ return PG.round<=KICKS ? `Cobrança ${PG.round} de ${KICKS}` : `Alternadas · cobrança ${PG.round}`; }
function penReady(){
  const i = PG.order[PG.k];
  tag(penLabel());
  render(`<section>
    ${penBoard(true)}
    <h2 class="center">${penLabel()}</h2>
    <div class="panel">${led(ledTime(PG.target))}<div class="plabel">tempo-alvo desta cobrança</div></div>
    ${PG.k===1?`<p class="center">${esc(PG.names[PG.order[0]])} já cobrou. O tempo dele fica escondido até o fim.</p>`:''}
    <div class="who">${esc(PG.names[i])}</div>
    <button class="btn" id="go">Sou ${esc(PG.names[i])}, vou cobrar</button>
  </section>`, 'p-ready');
  $('#go').onclick = () => penKick(i);
}
function penKick(i){
  const sw = stopwatch({ pre: led(ledTime(PG.target)), label:`alvo · vez de ${esc(PG.names[i])}`, show: !!P.show, onStop: ms => {
    PG.times[i] = ms; PG.k++;
    setTimeout(()=> PG.k<2 ? penReady() : penResult(), P.show?1200:600);
  }});
  render(`<section>${sw.html}</section>`, 'p-kick');
  sw.bind();
}
function penResult(){
  const d = PG.times.map(t=>Math.abs(t-PG.target));
  // quem errou por menos faz o gol; empate exato (mesmo valor no visor) dá gol pros dois
  const dc = d.map(x => Math.round(x/10)); // em centésimos, igual ao visor
  const tie = dc[0] === dc[1];
  const hit = tie ? [true,true] : [dc[0]<dc[1], dc[1]<dc[0]];
  PG.goals[0].push(hit[0]); PG.goals[1].push(hit[1]);
  const g = PG.goals.map(x=>x.filter(Boolean).length);
  const done = PG.goals[0].length, left = Math.max(0, KICKS-done);
  let over = false;
  if(done < KICKS){ if(g[0] > g[1]+left || g[1] > g[0]+left) over = true; }
  else if(g[0]!==g[1]) over = true;
  const n = hit.filter(Boolean).length;
  try{ beep(n===2?1700:n===1?1400:500, .25); }catch(e){}
  const title = n===2 ? 'DOIS GOLS!' : 'GOOOL!';
  const txt = n===2 ? 'Empate exato: os dois erraram pelo mesmo tanto. Gol pra cada lado.'
    : `<strong style="color:var(--fg)">${esc(PG.names[hit[0]?0:1])}</strong> chegou mais perto e fez o gol. ${esc(PG.names[hit[0]?1:0])} perdeu.`;
  tag(penLabel());
  render(`<section>
    <div class="goal" ${n===0?'style="color:var(--imp)"':''}>${title}</div>
    <p class="center">${txt}</p>
    <div class="duel">${[0,1].map(i=>`<div class="${hit[i]?'win':''}"><b>${esc(PG.names[i])}</b><span class="t">${fmt(PG.times[i])}</span><small>${hit[i]?'⚽ gol':'✕ pegou'} · errou ${(d[i]/1000).toFixed(2)}s</small></div>`).join('')}</div>
    <p class="center hint">Alvo era ${ledTime(PG.target)}s.</p>
    ${penBoard(false)}
    <button class="btn" id="next">${over?'Ver o campeão':done===KICKS-1&&!over?'Última cobrança':done>=KICKS?'Alternadas: próxima cobrança':'Próxima cobrança'}</button>
  </section>`, 'p-result');
  $('#next').onclick = () => over ? penEnd() : penRound();
}
function penEnd(){
  const g = PG.goals.map(x=>x.filter(Boolean).length);
  const w = g[0]>g[1]?0:1;
  tag('Pênaltis · fim');
  try{ beep(1200,.12); setTimeout(()=>beep(1600,.12),160); setTimeout(()=>beep(2000,.3),320); }catch(e){}
  render(`<section>
    <div class="panel"><div class="plabel">placar final</div>${led(String(g[0]).slice(-1)+' '+String(g[1]).slice(-1))}<div class="plabel">${esc(PG.names[0])} × ${esc(PG.names[1])}</div></div>
    <div class="verdict" style="color:var(--led)">${esc(PG.names[w])} é campeão!</div>
    <p class="center">Venceu por ${g[w]} a ${g[1-w]}${PG.goals[0].length>KICKS?' nas alternadas':''}.</p>
    ${penBoard(false)}
    <button class="btn" id="again">Revanche</button>
    <button class="ghost" id="edit">Mudar jogadores</button>
  </section>`, 'p-end');
  $('#again').onclick = () => { PG = { names:PG.names, goals:[[],[]], round:0 }; penRound(); };
  $('#edit').onclick = penSetup;
}

const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function guessMatches(typed, P1){
  const t = norm(typed); if(t.length<2) return false;
  const n = norm(P1.n);
  if(t===n || t===n.replace(/ /g,'')) return true;
  if((ALIAS[P1.n]||[]).some(a=>norm(a)===t)) return true;
  // uma palavra inteira do nome com 4+ letras ("cristiano", "junior")
  return n.split(' ').some(w => w.length>=4 && w===t);
}

function duelStart(){

  GG.order = shuffle([...S.players]); GG.k = 0; GG.times = {};

function duelPass(){
  const p = GG.order[GG.k];
  tag(`Adivinhe · dica ${GG.shown}/${MAXPTS}`);
  render(`<section>
    <h2 class="center">Jogador ${GG.i+1} de ${GG.deck.length} · disputa pela dica ${GG.shown}</h2>
    <div class="panel">${led(ledTime(GG.target))}<div class="plabel">tempo-alvo · quem chegar mais perto ganha a dica</div></div>
    <div class="who">${esc(p)}</div>
    <p class="center">${GG.k>0?`${GG.k} de ${GG.order.length} já cobraram.`:'Todo mundo tenta o mesmo tempo.'}</p>
    <button class="btn" id="go">Sou ${esc(p)}, vou cronometrar</button>
  </section>`, 'd-pass');
  $('#go').onclick = () => {
    const sw = stopwatch({ pre: led(ledTime(GG.target)), label:`alvo · vez de ${esc(p)}`, onStop: ms => {
      GG.times[p] = ms; GG.k++;
      setTimeout(()=> GG.k < GG.order.length ? duelPass() : duelWinner(), 600);
    }});
    render(`<section>${sw.html}</section>`, 'd-kick'); sw.bind();
  };
}
function duelWinner(){
  const rows = GG.order.map(p=>({ name:p, ms:GG.times[p], d:Math.abs(GG.times[p]-GG.target) })).sort((a,b)=>a.d-b.d);
  GG.winner = rows[0].name;
  try{ beep(1700,.2); }catch(e){}
  render(`<section>
    <div class="goal" style="font-size:2.2rem">${esc(GG.winner)} ganhou a dica!</div>
    <p class="center">Errou por só ${(rows[0].d/1000).toFixed(2)}s. Alvo era ${ledTime(GG.target)}s.</p>
    <div class="box">${bars(rows.map(r=>({name:r.name, ms:r.ms, cls:r.name===GG.winner?'crew':''})), GG.target)}</div>
    <p class="center">Passe o celular pra <strong style="color:var(--fg)">${esc(GG.winner)}</strong>. Só ele vê a dica.</p>
    <button class="btn" id="see">Sou ${esc(GG.winner)}, ver minha dica</button>
  </section>`, 'd-winner');
  $('#see').onclick = duelClue;
}
function duelClue(){
  const P1 = GG.deck[GG.i], w = GG.winner, idx = GG.shown-1, pts = MAXPTS - idx;
  GG.known[w] = GG.known[w] || []; if(!GG.known[w].includes(idx)) GG.known[w].push(idx);
  const mine = GG.known[w].slice().sort((a,b)=>a-b);
  render(`<section>

    <ol class="clues">${mine.map(k=>`<li class="${k===idx?'new':''}"><span class="cn">${k+1}</span><span>${esc(P1.c[k])}</span></li>`).join('')}</ol>

function duelNext(){

function guessRound(){

function guessReveal(who, pts){

const DV = Object.assign({ target:3, rounds:5, scores:{} }, store.get('ci-dv', {}) || {});

const dvPersist = () => store.set('ci-dv', DV);
let DG = null;
const dvTotal = () => DG.chain.reduce((s,c)=>s+c.ms,0);

function dvChain(reveal){
  const T = DV.target*1000; let acc = 0;
  return `<div class="chain">${DG.chain.map((c,i)=>{
    acc += c.ms; const over = acc > T;
    return `${i?'<span class="arrow">+</span>':''}<div class="lk ${reveal?(over?'bad':'ok'):'hid'} ${!reveal&&i===DG.chain.length-1?'last':''}"><b>${esc(c.p)}</b><span>${reveal?fmt(c.ms):'?.??'}</span>${reveal?`<small style="font-family:var(--mono);color:var(--muted)">soma ${fmt(acc)}</small>`:''}</div>`;
  }).join('')}${DG.chain.length?'':'<span class="hint">ninguém foi ainda</span>'}</div>`;
}
function dvSetup(){

      <div class="row"><span>Rodadas</span><div class="step"><button data-dr="-1" aria-label="Menos">−</button><output>${DV.rounds}</output><button data-dr="1" aria-label="Mais">+</button></div></div>

function dvRound(){
  DG.round++;
  const start = (DG.round-1) % S.players.length;
  DG.order = [...S.players.slice(start), ...S.players.slice(0,start)];
  DG.idx = 0; DG.chain = [];

}
function dvPass(){

  render(`<section>

function dvKick(p){

    DG.chain.push({ p, ms });

function dvShowdown(doubter){
  const T = DV.target*1000, total = dvTotal();
  const last = DG.chain[DG.chain.length-1];
  const bust = total > T;
  const winner = bust ? doubter : last.p;

  try{ beep(bust?500:1700,.3); }catch(e){}

}
function dvForced(){
  // ninguém duvidou em 4 voltas inteiras: revela e segue
  const T = DV.target*1000, total = dvTotal(), bust = total > T, last = DG.chain[DG.chain.length-1];
  if(!bust){ DG.pts[last.p]++; DV.scores[last.p]=(DV.scores[last.p]||0)+1; dvPersist(); }

function pitch(w, opts={}){
  const t = LG.teams[w];
  const spots = [ ['ATA',0,50,13], ['MEI',0,26,38], ['MEI',1,74,38], ['ZAG',0,50,62], ['GOL',0,50,87] ];
  const byPos = {}; t.squad.forEach(s=>{ (byPos[s.pos]=byPos[s.pos]||[]).push(s); });
  const slots = spots.map(([pos,k,x,y])=>{
    const s = (byPos[pos]||[])[k];
    const hot = opts.hot===pos && !s && canTake(t,pos);
    return s
      ? `<div class="spot" style="left:${x}%;top:${y}%"><span class="face ${s.filler?'fill':''}">${esc(initials(s.n))}</span><b>${esc(s.n)}</b><i>${s.r}${s.filler?'':' · R$'+s.paid}</i></div>`
      : `<div class="spot empty ${hot?'hot':''}" style="left:${x}%;top:${y}%"><span class="face">${pos}</span><b>${hot?'vaga livre':''}</b></div>`;
  }).join('');
  return `<div class="pitchwrap ${opts.cls||''}">
    <div class="pth"><b>${esc(w)}${opts.champ?' 🏆':''}</b><span class="money">${opts.final?'nota '+rating(t):'R$ '+t.money}</span></div>
    <div class="pitch"><div class="box6 top"></div><div class="box6 bot"></div><div class="mid"></div><div class="circle"></div>${slots}</div>
  </div>`;
}

}
const maxBid = t => t.money - (TEAM - t.squad.length - 1); // guarda R$1 por vaga que ainda vai abrir
function lauRefill(){
  // acabou a fila: sorteia mais craques só das posições que ainda faltam
  const used = new Set(LG.pool.map(p=>p[0]));
  const need = {}; Object.values(LG.teams).forEach(t=>Object.keys(SLOTS).forEach(pos=>{ need[pos]=(need[pos]||0)+(SLOTS[pos]-countPos(t,pos)); }));
  const extra = shuffle(POOL.filter(p=>!used.has(p[0]) && need[p[1]]>0));
  const add = []; Object.keys(need).forEach(pos=>{ add.push(...extra.filter(p=>p[1]===pos).slice(0, need[pos]+1)); });
  LG.pool.push(...shuffle(add));
  return add.length>0;
}
function lauNext(){
  if(allFull()) return lauEnd();
  for(;;){
    while(LG.i < LG.pool.length){
      const pos = LG.pool[LG.i][1];
      if(Object.values(LG.teams).some(t=>canTake(t,pos) && maxBid(t)>=1)) break;
      LG.i++;
    }
    if(LG.i < LG.pool.length) break;
    if(!lauRefill()) return lauEnd(); // elenco inteiro esgotado (muito raro)
  }
  const [n,pos,r] = LG.pool[LG.i];
  LG.lot = { n, pos, r }; LG.bid = 0; LG.leader = null; LG.lotNum++;
  lauLot();
}
function lauLot(){
  const L = LG.lot;
  tag(`Leilão · craque ${LG.lotNum}`);
  render(`<section>

    </div>
    <div class="bid">${LG.leader ? `<span>maior lance</span><b>R$ ${LG.bid}</b><span>de ${esc(LG.leader)}</span>` : `<span>sem lance ainda</span>`}</div>
    <div class="bidders">${LAU.who.map(w=>{ const t=LG.teams[w]; const ok = canTake(t,L.pos); const isLead = LG.leader===w;
      return `<div class="bidder ${isLead?'lead':''} ${ok?'':'out'}">
        <span class="bn">${esc(w)}${isLead?' 🔨':''}</span>

      </div>`; }).join('')}</div>
    <button class="hammer" id="hammer" ${LG.leader?'':'disabled'}>${LG.leader?`Bater o martelo: ${esc(LG.leader)} leva por R$ ${LG.bid}`:'Bater o martelo'}</button>
    <button class="ghost" id="skip">Ninguém quer, próximo craque</button>
    ${pitches({hot:L.pos})}
    <p class="center hint">${LG.pool.length-LG.i-1} craques na fila. Acabou a fila? O site sorteia mais até todo mundo fechar o time.</p>
  </section>`, 'lau-lot');
  $$('[data-bid]').forEach(b=>b.onclick=()=>{ const [w,v]=b.dataset.bid.split(':'); LG.bid=+v; LG.leader=w; try{ beep(1300,.05); }catch(e){} lauLot(); });

    LG.i++; lauSold();
  };
  $('#skip').onclick = () => { LG.i++; lauNext(); };
}
function lauSold(){
  const t = LG.teams[LG.leader], s = t.squad[t.squad.length-1];
  render(`<section>

function lauEnd(){

function confetti(n=90){

}
function countUp(el, to, ms=900){
  const t0 = performance.now();
  const step = () => { const k = Math.min(1,(performance.now()-t0)/ms); const e = 1-Math.pow(1-k,3); el.textContent = Math.round(to*e); if(k<1) requestAnimationFrame(step); };
  step();
}

/* =====================================================================
   CAMPEONATO (os times do leilão se enfrentam no cronômetro)
   ===================================================================== */
let CUP = null;
const CUPCFG = Object.assign({ goals:5 }, store.get('ci-cup', {}) || {});
CUPCFG.goals = Math.max(1, Math.min(20, +CUPCFG.goals || 5));
const avg = a => a.reduce((s,x)=>s+x,0)/a.length;
const atkOf = t => avg(t.squad.filter(s=>s.pos==='ATA'||s.pos==='MEI').map(s=>s.r));
const defOf = t => avg(t.squad.filter(s=>s.pos==='GOL'||s.pos==='ZAG').map(s=>s.r));
const windowMs = (a,b) => Math.max(200, Math.min(900, Math.round(450 * Math.pow(atkOf(LG.teams[a])/defOf(LG.teams[b]), 3))));
function cupStart(){
  const w = LAU.who, matches = [];
  for(let i=0;i<w.length;i++) for(let j=i+1;j<w.length;j++) matches.push({ a:w[i], b:w[j], g:[0,0], k:0, log:[] });
  CUP = { matches, m:0, table:Object.fromEntries(w.map(x=>[x,{p:0,gf:0,ga:0,w:0,d:0,l:0}])) };
  cupIntro();
}
function cupIntro(){
  const M = CUP.matches[CUP.m];
  tag(`Campeonato · jogo ${CUP.m+1}/${CUP.matches.length}`);
  render(`<section>
    <h1 class="center">${esc(M.a)} × ${esc(M.b)}</h1>
    <p class="center">Os ataques alternam. Em cada um, quem ataca tenta parar o cronômetro escondido no tempo-alvo. Errou pouco, é gol. A janela de gol depende do ataque de um contra a defesa do outro. <strong style="color:var(--fg)">Quem fizer ${CUPCFG.goals} gols primeiro vence.</strong></p>
    <div class="box"><div class="row"><span>Gols pra vencer</span><div class="step"><button data-cg="-1" aria-label="Menos">−</button><output>${CUPCFG.goals}</output><button data-cg="1" aria-label="Mais">+</button></div></div></div>
    <div class="box">
      <div class="row"><span>Ataque de ${esc(M.a)} contra defesa de ${esc(M.b)}</span><span class="t" style="font-family:var(--mono);color:var(--led)">janela ±${(windowMs(M.a,M.b)/1000).toFixed(2)}s</span></div>
      <div class="row"><span>Ataque de ${esc(M.b)} contra defesa de ${esc(M.a)}</span><span class="t" style="font-family:var(--mono);color:var(--led)">janela ±${(windowMs(M.b,M.a)/1000).toFixed(2)}s</span></div>
    </div>
    ${pitches({})}
    <button class="btn" id="go">Apita o juiz!</button>
  </section>`, 'cup-intro');
  $$('[data-cg]').forEach(b=>b.onclick=()=>{ CUPCFG.goals=Math.max(1,Math.min(20,CUPCFG.goals+(+b.dataset.cg))); store.set('ci-cup',CUPCFG); cupIntro(); });
  $('#go').onclick = cupAttack;
}
function cupAttack(){
  const M = CUP.matches[CUP.m];
  const atkIdx = M.k % 2, atk = atkIdx===0 ? M.a : M.b, def = atkIdx===0 ? M.b : M.a;
  const n = Math.floor(M.k/2)+1, win = windowMs(atk, def), target = randTarget(3, 10);
  const need = CUPCFG.goals;
  tag(`${esc(M.a)} ${M.g[0]} × ${M.g[1]} ${esc(M.b)}`);
  render(`<section>
    <div class="scorebig"><b>${esc(M.a)}</b><span class="sc">${M.g[0]}–${M.g[1]}</span><b>${esc(M.b)}</b></div>
    <h2 class="center">Ataque ${n} · ${esc(atk)} ataca · primeiro a ${need} gols</h2>
    <div class="panel">${led(ledTime(target))}<div class="plabel">alvo · gol se errar até ${(win/1000).toFixed(2)}s</div></div>
    <div class="who">${esc(atk)}</div>
    <button class="btn" id="go">Sou ${esc(atk)}, vou chutar</button>
  </section>`, 'cup-ready');
  $('#go').onclick = () => {
    const sw = stopwatch({ pre: led(ledTime(target)), label:`alvo · chute de ${esc(atk)}`, onStop: ms => {
      const err = Math.abs(ms-target), goal = err <= win;
      if(goal) M.g[atkIdx]++;
      M.log.push({ atk, goal, err });
      try{ beep(goal?1700:400, .3); }catch(e){}
      setTimeout(()=>{
        render(`<section>
          <div class="goal" ${goal?'':'style="color:var(--imp)"'}>${goal?'GOOOL!':'DEFENDEU!'}</div>
          <p class="center">${esc(atk)} parou em ${fmt(ms)}, errou ${(err/1000).toFixed(2)}s. ${goal?`Dentro da janela de ${(win/1000).toFixed(2)}s!`:`A janela era ${(win/1000).toFixed(2)}s. A zaga de ${esc(def)} segurou.`}</p>
          <div class="scorebig"><b>${esc(M.a)}</b><span class="sc">${M.g[0]}–${M.g[1]}</span><b>${esc(M.b)}</b></div>
          <button class="btn" id="next">${M.g[atkIdx] >= need ? 'Fim de jogo' : 'Próximo ataque'}</button>
        </section>`, 'cup-res');
        $('#next').onclick = () => { M.k++; M.g[0] >= need || M.g[1] >= need ? cupMatchEnd() : cupAttack(); };
      }, 500);
    }});
    render(`<section>${sw.html}</section>`, 'cup-kick'); sw.bind();
  };
}
function cupMatchEnd(){
  const M = CUP.matches[CUP.m], T = CUP.table;
  T[M.a].gf += M.g[0]; T[M.a].ga += M.g[1]; T[M.b].gf += M.g[1]; T[M.b].ga += M.g[0];
  if(M.g[0]>M.g[1]){ T[M.a].p+=3; T[M.a].w++; T[M.b].l++; } else if(M.g[1]>M.g[0]){ T[M.b].p+=3; T[M.b].w++; T[M.a].l++; } else { T[M.a].p++; T[M.b].p++; T[M.a].d++; T[M.b].d++; }
  const last = CUP.m === CUP.matches.length-1;
  render(`<section>
    <div class="verdict" style="color:var(--warn)">${M.g[0]===M.g[1]?'Empate!':`${esc(M.g[0]>M.g[1]?M.a:M.b)} venceu!`}</div>
    <div class="scorebig"><b>${esc(M.a)}</b><span class="sc">${M.g[0]}–${M.g[1]}</span><b>${esc(M.b)}</b></div>
    ${CUP.matches.length>1 ? cupTable() : ''}
    <button class="btn" id="next">${last?'Ver o campeão':'Próximo jogo'}</button>
  </section>`, 'cup-mend');
  $('#next').onclick = () => { if(!last){ CUP.m++; return cupIntro(); } cupEnd(); };
}
function cupRank(){ return Object.keys(CUP.table).sort((a,b)=>{ const A=CUP.table[a],B=CUP.table[b]; return B.p-A.p || (B.gf-B.ga)-(A.gf-A.ga) || B.gf-A.gf || rating(LG.teams[b])-rating(LG.teams[a]); }); }
function cupTable(){
  return `<div class="box" style="overflow-x:auto"><h2>Classificação</h2><table class="table"><thead><tr><th>Time</th><th>P</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th></tr></thead><tbody>${cupRank().map(w=>{ const t=CUP.table[w]; return `<tr><td>${esc(w)}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td></tr>`; }).join('')}</tbody></table></div>`;
}
function cupEnd(){
  const r = cupRank(), w = r[0], t = CUP.table[w];
  tag('Campeonato · campeão');
  celebrate({ sub:'campeão do campeonato', name:w, detail: CUP.matches.length>1 ? `${t.p} pontos · ${t.gf} gols` : `${t.gf} × ${t.ga}`, btn:'Ver a classificação', onNext: () => {
    render(`<section><div class="verdict" style="color:var(--warn)">${esc(w)} é o campeão!</div>${CUP.matches.length>1?cupTable():''}${pitches({final:true})}
      <button class="btn" id="again">Jogar o campeonato de novo</button><button class="ghost" id="lau">Novo leilão</button></section>`, 'cup-end');

}

function ltBid(){
